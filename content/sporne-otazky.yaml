        typZdroje: vyrok
        zdroj:
          text: Kandidáti na primátora chtějí rozhýbat výstavbu (Pražský deník, Summit bydlení)
          url: https://prazsky.denik.cz/komunalni-volby/kandidati-na-primatora-chteji-rozhybat-vystavbu-praha-ma-investovat-miliardy/
          datum: 2026-09-12
      - subjekt: sen-pro-prahu
        moznost: dostavet
        shrnuti: "Program chce dokončit dostavbu silničních okruhů a odvést z Magistrály tranzit, aby z ní byl městský bulvár."
        typZdroje: program
        zdroj:
          text: Program SEN pro Prahu — Doprava
          url: https://praha.senprocesko.cz/program/doprava
          datum: 2026-09-14
      - subjekt: ceska-piratska-strana
        moznost: dostavet
