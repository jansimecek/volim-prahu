  - id: myto-centrum
    okruh: doprava
    otazka: "Zpoplatnit vjezd aut do centra?"
    kontext: >-
      Zákon o pozemních komunikacích zná mýtné jen na silnicích a dálnicích
      určených státem, s výnosem pro Státní fond dopravní infrastruktury.
      Obci dovoluje zpoplatnit stání (§ 23), ne vjezd. Mýto do centra by tedy
      potřebovalo změnu zákona, kterou Praha sama neprosadí.
    moznosti:
      - id: ano
        popis: Zavést, pilotně hned
      - id: pozdeji
        popis: Až po okruzích, nebo otevřít debatu
      - id: ne
        popis: Nezavádět
    odpovedi:
      - subjekt: sen-pro-prahu
        moznost: ano
        shrnuti: "Program chce zpoplatnit vjezd do historického centra ve špičce, pilotně na Starém Městě a Malé Straně."
        typZdroje: program
        zdroj:
          text: Program SEN pro Prahu — Doprava
          url: https://praha.senprocesko.cz/program/doprava
          datum: 2026-09-14
      - subjekt: spojena-levice-pro-prahu
        moznost: pozdeji
        shrnuti: "Mýto do centra ano, ale výslovně až po dokončení dálničního a městského okruhu."
        typZdroje: program
        zdroj:
          text: Program Spojené levice pro Prahu, kapitola Doprava a MHD
          url: https://spojenalevice.cz/kompletniprogram/program_spojena_levice_doplneny-1.pdf
          datum: 2026-09-04
      - subjekt: ceska-piratska-strana
        moznost: pozdeji
        shrnuti: "Program chce nízkoemisní zónu uvnitř Městského okruhu a o zpoplatnění vjezdu do centra „povede diskusi“."
        typZdroje: program
        zdroj:
          text: "Program Pirátů pro Prahu — Čistá mobilita"
          url: https://program2026.praha.pirati.cz/program/doprava/5/
          datum: 2026-09-30

  - id: metropolitni-plan
    okruh: uzemni-plan
    otazka: "Stavět na schváleném Metropolitním plánu, nebo ho měnit?"
    kontext: >-
      Nový územní plán schválilo zastupitelstvo 28. května 2026, 50 hlasy
      z 65, a platí od 1. září. Změnit ho může jen zastupitelstvo a změna
      trvá roky. Kdo chce „měnit“, nemusí chtít totéž: jedni chtějí stavět
      výš, druzí sídliště nezahušťovat.
    moznosti:
      - id: stavet-na-nem
        popis: Stavět na něm, převést do investic
      - id: zmenit
        popis: Změnit některé části
      - id: proti
        popis: Proti plánu (hlasování)
    odpovedi:
      - subjekt: starostove-a-nezavisli
        moznost: stavet-na-nem
        shrnuti: "Program staví na schváleném plánu a chce ho převést do harmonogramů a investic. Lídr jako náměstek plán připravoval."
        typZdroje: program
        zdroj:
          text: Program STAN pro Zastupitelstvo hl. m. Prahy
          url: https://www.starostove.cz/zastupitelstvo-hl-mesta-prahy
          datum: 2026-09-14
      - subjekt: spolu-pro-prahu
        moznost: zmenit
        shrnuti: "Směr výš: lídr chce v rámci úprav plánu otevřít debatu o výškových limitech tam, kde to dává urbanistický smysl."
        typZdroje: vyrok
        zdroj:
          text: "Anketa: Jak chtějí pražští lídři řešit krizi bydlení (Echo24)"
          url: https://www.echo24.cz/a/H69UR/zpravy-domaci-anketa-echa-kandidati-na-primatora-praha-reseni-krize-bydleni-druzstva-developeri
          datum: 2026-09-19
      - subjekt: sen-pro-prahu
        moznost: zmenit
        shrnuti: "Směr méně: program chce zásadně přehodnotit části plánu o sídlištích, odmítá jejich zahušťování a výškové stavby mezi paneláky."
        typZdroje: program
        zdroj:
          text: Program SEN pro Prahu — Ochrana sídlišť
          url: https://praha.senprocesko.cz/program/ochrana-sidlist
          datum: 2026-09-14
      - subjekt: jsme-praha
        moznost: proti
        shrnuti: "Lídryně Jana Komrsková byla jednou ze tří zastupitelů, kteří 28. května 2026 hlasovali proti vydání plánu."
        typZdroje: hlasovani
        zdroj:
          text: Proti Metropolitnímu plánu byly jen tři zastupitelky (Pražský deník)
          url: https://prazsky.denik.cz/zpravy_region/praha-se-dockala-noveho-uzemniho-planu-schvalili-ho-zastupitele-20260528.html
          datum: 2026-05-28

  - id: rezervy
    okruh: rozpocet
    otazka: "Jsou peníze na účtech města neproinvestované, nebo vázané na stavby?"
    kontext: >-
      Kandidáti uvádějí 175 až 200 miliard korun na účtech Prahy; číslo je
      jejich tvrzení. Spor je o to, jestli jde o volné peníze, které se mají
      rychle utratit, nebo o rezervu na metro D a okruh, která zmizí se
      zahájením staveb.
    moznosti:
      - id: investovat
        popis: Neproinvestované, utratit rychleji
      - id: vazane
        popis: Vázané na velké stavby
    odpovedi:
      - subjekt: ano-2011
        moznost: investovat
        shrnuti: "Lídr: peníze nejsou našetřené, ale neproinvestované a patří Pražanům."
        typZdroje: vyrok
        zdroj:
          text: Našetřeno, nebo neproinvestováno? (Novinky.cz, duel Portlík–Hušbauer)
          url: https://www.novinky.cz/clanek/volby-komunalni-nasetreno-nebo-neproinvestovano-portlik-a-husbauer-se-preli-o-200-miliardach-na-uctu-prahy-40598462
          datum: 2026-09-21
      - subjekt: praha-sobe
        moznost: investovat
        shrnuti: "Program: 175 miliard leží ladem a má jít do dopravy, nových škol a masivní výstavby městských bytů, i přes investiční fond."
        typZdroje: program
        zdroj:
          text: Program Praha sobě pro volby 2026 (PDF)
          url: https://prahasobe.cz/praha-sobe-volebni-program-2026.pdf
          datum: 2026-09-30
      - subjekt: spolu-pro-prahu
        moznost: vazane
        shrnuti: "Lídr: peníze jsou potřeba na metro D, vnitřní okruh a další stavby a se zahájením staveb z účtu rychle zmizí."
        typZdroje: vyrok
        zdroj:
          text: Našetřeno, nebo neproinvestováno? (Novinky.cz, duel Portlík–Hušbauer)
          url: https://www.novinky.cz/clanek/volby-komunalni-nasetreno-nebo-neproinvestovano-portlik-a-husbauer-se-preli-o-200-miliardach-na-uctu-prahy-40598462
          datum: 2026-09-21
