          datum: 2026-09-22
      - subjekt: praha-sobe
        moznost: dostavet
        shrnuti: "Program slibuje odbrzdit Blanku II a spustit geologický průzkum; lídr by jako primátor zahájil stavbu v příštím období."
        typZdroje: program
        zdroj:
