      - subjekt: starostove-a-nezavisli
        moznost: s-vyhradou
        shrnuti: "Program chce prosazovat dokončení Pražského i Městského okruhu, lídr ale považuje za naivní čekat, že okruh něco zachrání; klíčem je podle něj metro S."
