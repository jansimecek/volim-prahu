# Postoje Pirátů k okruhům srovnání.
#
# Zapsáno z článku, kterým pražští Piráti zveřejnili Akční plán bydlení.
# Článek sám datum nenese; plán podle něj představili na čtvrtečním zahájení
# kampaně na Pankráci, o kterém psal Pražský patriot 23. 5. 2026 — jde tedy
# o čtvrtek 21. 5. 2026. Otevřeno 4. 9. 2026, se surovým textem článku znovu
# porovnáno 14. 9. 2026.
#
# Je to plán k jednomu tématu, ne ucelený program — proto je tu jen bydlení
# a financování, které z něj přímo plyne. Externí rešerše u Pirátů uváděla
# financování z EIB; plán počítá s pražským investičním fondem, který si má
# půjčovat od velkých bank, a EIB nejmenuje.
#
# Oprava ze 14. 9.: akcelerační zóny tu byly zapsané jako slib města, přitom
# je podle plánu teprve musí umožnit Sněmovna, a koleje v Karlíně, Troji a na
# Palmovce jako slib, přitom o nich plán mluví jen jako o zvažovaných místech.
# U zdroje se místo dne ověření zobrazovalo datum představení plánu.
#
# Doplněno 30. 9. 2026: kompletní program (program2026.praha.pirati.cz,
# závazný od 9. 9., verze textu z 19. 9.) přidal postoje k dopravě, školství,
# sociálním službám a životnímu prostředí. Každá věta je porovnaná se surovým
# textem příslušné podstránky programu.

subjekt: ceska-piratska-strana
uroven: magistrat
overeno: 2026-09-30

postoje:
  - okruh: bydleni
    shrnuti: "Postavit několik tisíc městských bytů za období a posílit Pražskou developerskou společnost"
    postoj: >-
      Akční plán slibuje za volební období postavit několik tisíc městských
      bytů pro mladé rodiny, samoživitele, nízkopříjmové domácnosti
      a podporované profese, jako jsou učitelé a zdravotní sestry. Pražskou
      developerskou společnost chce finančně i personálně posílit, menší
      městské pozemky nabídnout družstvům a počet bytů Městské nájemní
      agentury rozšířit ze 75 na 500.
    typZdroje: program
    zdroj:
      text: Piráti představili Akční plán bydlení v Praze
      url: https://praha.pirati.cz/aktuality/pirati-predstavili-akcni-plan-bydleni-v-praze/
      datum: 2026-09-14
    proveditelnost:
      agenda: bytovy-fond
      kompetence: castecne
      rozpocet: nejiste
      cas: presahuje
    poznamka: >-
      „Několik tisíc“ plán nijak nezpřesňuje, splnění tedy nepůjde změřit
      proti konkrétnímu číslu.

  - okruh: bydleni
    shrnuti: "Akcelerační zóny pro tři nové čtvrti u metra, pokud je umožní zákon"
    postoj: >-
      Plán chce dál usilovat o to, aby Sněmovna umožnila akcelerační zóny se
      zvláštním režimem územního plánování a povolování staveb. Díky nim by
      vznikly tři nové čtvrti — Nové Kolovraty, Východní a Západní město —
      s bydlením pro 200 tisíc lidí a prostory pro 70 tisíc pracovních míst,
      napojené na prodloužené linky metra A, B a C. Územním plánováním chce
      dosáhnout toho, aby v Praze přibývalo 10 tisíc bytů ročně.
    typZdroje: program
    zdroj:
      text: Piráti představili Akční plán bydlení v Praze
      url: https://praha.pirati.cz/aktuality/pirati-predstavili-akcni-plan-bydleni-v-praze/
      datum: 2026-09-14
    proveditelnost:
      agenda: uzemni-plan
      kompetence: castecne
      rozpocet: nejiste
      cas: presahuje
    poznamka: >-
      Podle plánu z května 2026 akcelerační zóny zatím zákon neumožňuje; jejich
      zavedení závisí na Sněmovně. Cíl 10 tisíc bytů ročně není závazek, že je
      město postaví — většinu bytů v Praze stavějí soukromí investoři.

  - okruh: bydleni
    shrnuti: "Několikanásobná daň z nemovitosti na dlouhodobě prázdné domy"
    postoj: >-
      Plán chce uvalit několikanásobnou daň z nemovitosti na dlouhodobě
      prázdné bytové domy a stejně zdanit domy, které celé slouží k ubytování
      turistů místo bydlení.
    typZdroje: program
    zdroj:
      text: Piráti představili Akční plán bydlení v Praze
      url: https://praha.pirati.cz/aktuality/pirati-predstavili-akcni-plan-bydleni-v-praze/
      datum: 2026-09-14
    proveditelnost:
      kompetence: v-pravomoci
      rozpocet: pokryto
      cas: do-4-let
    poznamka: >-
      Zákon o dani z nemovitých věcí v § 12 dovoluje stanovit místní koeficient
      až 5,0, a to i opatřením obecné povahy, které vydává zastupitelstvo, pro
      jednotlivé vymezené nemovité věci. Nástroj tedy město drží. Prázdnotu
      domu ale § 12 jako důvod nezmiňuje — které domy koeficient ponesou, musí
      zastupitelstvo v opatření vymezit samo.

  - okruh: bydleni
    shrnuti: "Nové koleje s vysokými školami, zvažované třeba v Karlíně, Troji a na Palmovce"
    postoj: >-
      Plán slibuje s vysokými školami vytipovat místa pro nové koleje a pak
      pomoci s jejich stavbou, nebo je postavit přímo. Jako možná místa
      zmiňuje Kasárna Karlín, Troju a Palmovku.
    typZdroje: program
    zdroj:
      text: Piráti představili Akční plán bydlení v Praze
      url: https://praha.pirati.cz/aktuality/pirati-predstavili-akcni-plan-bydleni-v-praze/
      datum: 2026-09-14
    proveditelnost:
      agenda: sverenymajetek
      kompetence: castecne
      rozpocet: nejiste
      cas: presahuje

  - okruh: rozpocet
    shrnuti: "Pražský investiční fond, který si půjčí od bank a splácí z nájemného"
    postoj: >-
      Výstavbu městských bytů má financovat nově založený pražský investiční
      fond, který si bude půjčovat od velkých bank; úvěry chce plán splácet
      z vybraného nájemného, aby výstavba méně zatěžovala rozpočet. Městským
      částem chce přes Fond rozvoje dostupného bydlení dávat víc peněz na nové
      byty a opravy prázdných, výměnou za část bytů pro celoměstskou bytovou
      politiku.
    typZdroje: program
    zdroj:
      text: Piráti představili Akční plán bydlení v Praze
      url: https://praha.pirati.cz/aktuality/pirati-predstavili-akcni-plan-bydleni-v-praze/
      datum: 2026-09-14
    proveditelnost:
      agenda: rozpocet-prahy
      kompetence: v-pravomoci
      rozpocet: nejiste
      cas: do-4-let

  - okruh: doprava
    shrnuti: "Metro D z Písnice k Nádraží Krč s provozem od 2032, nové tramvajové tratě, připravit dokončení Městského okruhu"
    postoj: >-
      Program slibuje dokončit ražbu tunelů metra D z Písnice k Nádraží Krč
      a hlídat zprovoznění prvního úseku v roce 2032, dokončit tramvajové
      tratě do Malešic, na Jarov, na Nové Dvory a na Strahov a připravit
      prodloužení metra do tří nových čtvrtí. Mezi silničními stavbami chce
      připravit dokončení Městského okruhu, Radlickou radiálu a Hloubětínský
      tunel.
    typZdroje: program
    zdroj:
      text: Program Pirátů pro Prahu — Doprava
      url: https://program2026.praha.pirati.cz/program/doprava/
      datum: 2026-09-30
    proveditelnost:
      agenda: mhd
      kompetence: castecne
      rozpocet: nejiste
      cas: presahuje
    poznamka: >-
      Rok 2032 pro první úsek metra D program jen „hlídá“, nesliboval ho
      splnit ve volebním období.

  - okruh: doprava
    shrnuti: "Parkovné podle poptávky, víc modrých zón na sídlištích, nízkoemisní zóna a debata o mýtu do centra"
    postoj: >-
      V reformě parkování chce program nastavit poplatky podle poptávky
      v jednotlivých lokalitách, rozšířit modré zóny do přetížených sídlišť,
      opilotovat dostupné parkovací domy na sídlištích a výnosy vracet do
      silnic, MHD a veřejného prostoru. Uvnitř Městského okruhu chce zavést
      nízkoemisní zónu a o zpoplatnění vjezdu do centra vést diskusi. Cenu
      jízdného program nezmiňuje.
    typZdroje: program
    zdroj:
      text: Program Pirátů pro Prahu — Promyšlené parkování a Čistá mobilita
      url: https://program2026.praha.pirati.cz/program/doprava/7/
      datum: 2026-09-30
    proveditelnost:
      agenda: parkovaci-zony
      kompetence: v-pravomoci
      rozpocet: pokryto
      cas: do-4-let

  - okruh: skolstvi
    shrnuti: "Nové střední školy na Hradčanské, Barrandově, Písnické a v Braníku, víc lyceí a gymnázií"
    postoj: >-
      Program slibuje prosadit nové středoškolské kapacity na Hradčanské, na
      Barrandově, v Písnické a v Braníku, rozšířit hlavně lycea a čtyřletá
      gymnázia i speciální vzdělávání a kofinancovat nové školy městských
      částí. O společném financování chce jednat se Středočeským krajem
      a ministerstvy.
    typZdroje: program
    zdroj:
      text: Program Pirátů pro Prahu — Školství
      url: https://program2026.praha.pirati.cz/program/skolstvi/1/
      datum: 2026-09-30
    proveditelnost:
      kompetence: v-pravomoci
      rozpocet: nejiste
      cas: presahuje
    poznamka: >-
      Program neuvádí počet nových míst ani termín. Střední školy zřizuje
      magistrát, základní a mateřské městské části.

  - okruh: socialni
    shrnuti: "Přednost péči doma a terénním službám, Nemocnici Na Františku převést pod město"
    postoj: >-
      Program dává přednost péči v domácím prostředí a menším komunitním
      zařízením, chce posílit terénní služby a podporu pečujících a nabídnout
      sociálním pracovníkům obecní byty. Nemocnici Na Františku, kterou
      provozuje Praha 1 a město ji dotuje, chce převést do správy hlavního
      města.
    typZdroje: program
    zdroj:
      text: Program Pirátů pro Prahu — Sociální politika a zdravotnictví
      url: https://program2026.praha.pirati.cz/program/socialni/
      datum: 2026-09-30

  - okruh: prostredi
    shrnuti: "Víc stromů a vody proti vedru, parky Trojská kotlina, Maniny, Soutok a Trojmezí, víc biopopelnic"
    postoj: >-
      Program chce pokračovat ve výsadbě stromů, zadržovat dešťovou vodu
      a stavět pítka a mlžítka proti letním vedrům. Slibuje pokročit
      s přípravou parků Trojská kotlina, Maniny, Soutok a Trojmezí
      a rozšiřovat sběr bioodpadu a biopopelnice.
    typZdroje: program
    zdroj:
      text: Program Pirátů pro Prahu — Životní prostředí
      url: https://program2026.praha.pirati.cz/program/prostredi/
      datum: 2026-09-30
