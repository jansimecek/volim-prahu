# Postoje STAN k okruhům srovnání.
#
# Zapsáno z programové stránky subjektu 4. 9. 2026, se surovým textem stránky
# znovu porovnáno 14. 9. 2026.
#
# Oprava ze 14. 9.: externí rešerše u STAN uváděla novou nemocnici v Letňanech,
# posílení Pražské developerské společnosti a úvěry EIB a při prvním zápisu tu
# stálo, že na programové stránce nic z toho není. To byla chyba — vycházeli
# jsme ze zkráceného výtahu stránky. Program nemocnici i posílení společnosti
# obsahuje; u Evropské investiční banky mluví o spolupráci při financování
# městského bydlení, o úvěrech výslovně ne. Opravený je i výčet lokalit u bytů:
# stavět se má v pěti, další čtyři se mají teprve připravovat.

subjekt: starostove-a-nezavisli
uroven: magistrat
overeno: 2026-09-14

postoje:
  - okruh: bydleni
    shrnuti: "Zahájit výstavbu 2 000 městských bytů: stavby v pěti lokalitách, další čtyři v přípravě"
    postoj: >-
      Program slibuje zahájit výstavbu dvou tisíc městských bytů
      v připravených lokalitách a posílit Pražskou developerskou společnost.
      Stavby chce rozběhnout na Nových Dvorech, na Palmovce, ve Vršovicích,
      v Dolních Počernicích a v Jinonicích; Letňany, Běchovice, Suchdol
      a Horní Počernice chce teprve připravovat. Byty chce nabízet přednostně
      mladým rodinám, seniorům, lidem se zdravotním postižením a profesím
      důležitým pro chod města.
    typZdroje: program
    zdroj:
      text: Program STAN pro Zastupitelstvo hl. m. Prahy
      url: https://www.starostove.cz/zastupitelstvo-hl-mesta-prahy
      datum: 2026-09-14
    proveditelnost:
      agenda: bytovy-fond
      kompetence: castecne
      rozpocet: nejiste
      cas: presahuje
    poznamka: >-
      Program neuvádí, kolik bytů má být za období dokončeno, ani kolik
      výstavba bude stát. K financování říká jen, že chce dokončit dlouhodobý
      systém včetně spolupráce s Evropskou investiční bankou, bez částek.
      „Zahájíme výstavbu“ je měřitelné jinak než „postavíme“.

  - okruh: doprava
    shrnuti: "Dotáhnout metro D, připravit koncept linky E, nové tramvajové tratě"
    postoj: >-
      Program slibuje dotáhnout výstavbu metra D a připravit koncept nové
      linky metra E, postavit tramvajové tratě na Nové Dvory, Strahov, do
      Suchdola a do Komořan, připravit přestavbu hlavního nádraží včetně
      takzvaného metra S a prosazovat dokončení Pražského i Městského okruhu.
      Podporuje také rychlé železniční spojení s letištěm.
    typZdroje: program
    zdroj:
      text: Program STAN pro Zastupitelstvo hl. m. Prahy
      url: https://www.starostove.cz/zastupitelstvo-hl-mesta-prahy
      datum: 2026-09-14
    proveditelnost:
      agenda: mhd
      kompetence: castecne
      rozpocet: nejiste
      cas: presahuje

  - okruh: uzemni-plan
    shrnuti: "Metropolitní plán do praxe, začít stavět Vltavskou filharmonii, proměna Magistrály"
    postoj: >-
      Program staví na schváleném Metropolitním plánu, který chce převést do
      harmonogramů a investic. Slibuje rozběhnout výstavbu tisíců bytů na
      městských pozemcích a brownfieldech, začít stavět Vltavskou filharmonii,
      tedy dotáhnout její povolení a financování, a zahájit proměnu Magistrály
      v městskou třídu.
    typZdroje: program
    zdroj:
      text: Program STAN pro Zastupitelstvo hl. m. Prahy
      url: https://www.starostove.cz/zastupitelstvo-hl-mesta-prahy
      datum: 2026-09-14
    proveditelnost:
      agenda: uzemni-plan
      kompetence: v-pravomoci
      rozpocet: nejiste
      cas: presahuje

  - okruh: rozpocet
    shrnuti: "Závazný plán strategických investic a stabilní financování městských částí"
    postoj: >-
      Program slibuje závazný plán strategických investic s pořadím velkých
      staveb, pružné řízení investic, aby zpoždění jednoho projektu nebrzdilo
      ostatní, a předvídatelná pravidla financování městských částí podle
      počtu obyvatel, dětí a žáků a nákladů nové výstavby.
    typZdroje: program
    zdroj:
      text: Program STAN pro Zastupitelstvo hl. m. Prahy
      url: https://www.starostove.cz/zastupitelstvo-hl-mesta-prahy
      datum: 2026-09-14
    proveditelnost:
      agenda: dotace-mestskym-castem
      kompetence: v-pravomoci
      rozpocet: nejiste
      cas: do-4-let

  - okruh: skolstvi
    shrnuti: "Rozšířit kapacity od mateřských po střední školy"
    postoj: >-
      Program slibuje navyšovat kapacity od mateřských po střední školy,
      včetně speciálních škol, domů dětí a mládeže a základních uměleckých
      škol, podle růstu jednotlivých čtvrtí. Učitelům chce nabídnout další
      vzdělávání, supervizi a dostupné městské bydlení.
    typZdroje: program
    zdroj:
      text: Program STAN pro Zastupitelstvo hl. m. Prahy
      url: https://www.starostove.cz/zastupitelstvo-hl-mesta-prahy
      datum: 2026-09-14
    proveditelnost:
      kompetence: castecne
      rozpocet: nejiste
      cas: presahuje
    poznamka: >-
      Mateřské a základní školy zřizují městské části, střední školy kraj,
      tedy v Praze magistrát. Jeden slib tak míří na dvě různé úrovně.

  - okruh: prostredi
    shrnuti: "Zelené promenády, rozvoj městské energetiky a ZEVO Malešice, revitalizace toků"
    postoj: >-
      Program slibuje zelené promenády na Praze 3, 6 a 10 a mezi Trojou
      a Libní, rozvoj městské energetiky a obnovitelných zdrojů včetně podpory
      modernizace ZEVO Malešice, rozšíření reuse center a revitalizaci vodních
      toků.
    typZdroje: program
    zdroj:
      text: Program STAN pro Zastupitelstvo hl. m. Prahy
      url: https://www.starostove.cz/zastupitelstvo-hl-mesta-prahy
      datum: 2026-09-14
    proveditelnost:
      agenda: verejna-zelen
      kompetence: castecne
      rozpocet: nejiste
      cas: presahuje
    poznamka: >-
      V nadpisu program promenády slibuje postavit, v textu pod ním je slibuje
      připravit.

  - okruh: socialni
    shrnuti: "Získat 270 chybějících strážníků, rozšířit stacionáře a terénní péči"
    postoj: >-
      Program slibuje posílit složky integrovaného záchranného systému
      a získat pro Prahu 270 chybějících strážníků, rozšířit denní a týdenní
      stacionáře i domácí a terénní péči, zavést náborové příspěvky pro
      pracovníky sociálních služeb a zrychlit bezbariérové úpravy MHD,
      veřejného prostoru a institucí.
    typZdroje: program
    zdroj:
      text: Program STAN pro Zastupitelstvo hl. m. Prahy
      url: https://www.starostove.cz/zastupitelstvo-hl-mesta-prahy
      datum: 2026-09-14
    proveditelnost:
      agenda: mestska-policie
      kompetence: v-pravomoci
      rozpocet: nejiste
      cas: do-4-let
    poznamka: >-
      Městská policie je zřizovaná magistrátem, počet strážníků tedy město
      ovlivnit může. Nábor chce program podpořit lepšími podmínkami a pomocí
      s vysokými náklady na život v Praze; neuvádí, v jaké podobě ani za kolik.

  - okruh: socialni
    shrnuti: "Prosazovat novou nemocnici v Letňanech, projekt závislý na státu"
    postoj: >-
      Program slibuje prosazovat výstavbu nové nemocnice v Letňanech, protože
      rostoucí severovýchodní část města podle něj potřebuje novou nemocniční
      kapacitu. Sám uvádí, že projekt závisí na spolupráci se státem a dalšími
      partnery. Vedle toho chce rozšířit síť praktických lékařů a pediatrů
      a podpořit ambulantní a domácí péči.
    typZdroje: program
    zdroj:
      text: Program STAN pro Zastupitelstvo hl. m. Prahy
      url: https://www.starostove.cz/zastupitelstvo-hl-mesta-prahy
      datum: 2026-09-14
    proveditelnost:
      kompetence: castecne
      rozpocet: nejiste
      cas: nedatovano
    poznamka: >-
      Slib zní prosazovat, ne postavit, a program neuvádí termín ani odhad
      nákladů.
