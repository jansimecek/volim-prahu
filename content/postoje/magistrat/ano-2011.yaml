# Postoje ANO 2011 k okruhům srovnání.
#
# Ucelený pražský program hnutí k 8. 9. 2026 nedohledán (viz profil), postoje
# jsou z doložených výroků lídra Jana Hušbauera. Přesné citace jsou
# v content/vyroky-lidru.yaml. Postoj k dopravě ze zahájení pražské kampaně
# přibyl 14. 9. 2026. Postoje z anket Echa24 o bydlení a Airbnb, ze
# školského podcastu Deníku a z ankety ČTK o parkování přibyly 30. 9. 2026.

subjekt: ano-2011
uroven: magistrat
overeno: 2026-09-30

postoje:
  - okruh: doprava
    shrnuti: "Roční kupon nezdražovat; nejdřív úspory a kontrola zakázek v DPP"
    postoj: >-
      Lídr v anketě o cenách MHD odmítl zdražení ročního kuponu pro Pražany
      a slevy pro seniory a lidi v nouzi označil za nedotknutelné. Finance
      Dopravního podniku chce řešit vnitřními úsporami a kontrolou zakázek;
      o cenách pro návštěvníky se podle něj dá mluvit až potom.
    typZdroje: vyrok
    zdroj:
      text: Anketa Echa — zdraží po volbách MHD? (Echo24)
      url: https://www.echo24.cz/a/Hnw5f/zpravy-domaci-anketa-echa-kandidati-na-primatora-praha-volby-zdrazi-po-volbach-mhd
      datum: 2026-08-12
    proveditelnost:
      agenda: mhd
      kompetence: v-pravomoci
      rozpocet: nejiste
      cas: do-4-let
    poznamka: >-
      Ceník PID schvaluje rada, takže nezdražit je v pravomoci; jak se bez
      zdražení pokryje rostoucí ztráta DPP, výrok neříká.

  - okruh: rozpocet
    shrnuti: "Město má přes 180 miliard na účtech a nestaví; do sta dnů audit metra D"
    postoj: >-
      Podle lídra má Praha na účtech přes 180 miliard korun a problém není
      nedostatek peněz, ale schopnost rozhodnout a dokončit. Jako primátor
      by do sta dnů nechal udělat audit harmonogramu a financování metra D
      a zveřejnil závazný investiční plán. Datum dokončení metra odmítá slibovat.
    typZdroje: vyrok
    zdroj:
      text: Metro D má vozit cestující za šest let, opozice volá po auditu (Echo24 / EchoPrime)
      url: https://www.echoprime.cz/a/HMSTF/metro-d-ma-vozit-cestujici-za-sest-let-opozice-vola-po-auditu-a-vetsi-kontrole
      datum: 2026-08-26
    poznamka: >-
      Výše rezerv je tvrzení kandidáta; rozpočtový rámec města a meze
      rezerv popisuje stránka /rozpoctovy-ramec.

  - okruh: bydleni
    shrnuti: "Vytýká koalici, že za osm let nepostavila žádný městský byt"
    postoj: >-
      V reakci na pirátské vyloučení ANO z povolební spolupráce lídr uvedl, že
      koalice s Piráty by jeho hnutí stejně neuzavřelo, a vytkl jim, že za osm
      let ve vedení města nepostavili žádný městský byt. Vlastní cíl v počtu
      bytů ani způsob výstavby veřejně nevyčíslil.
    typZdroje: vyrok
    zdroj:
      text: Pražští Piráti vyloučili povolební spolupráci s ANO a ANO nemá zájem o Piráty (Respekt / ČTK)
      url: https://www.respekt.cz/informacni-servis/prazsti-pirati-vyloucili-povolebni-spolupraci-s-ano-a-ano-nema-zajem-o-piraty-2026-08-12-12-45
      datum: 2026-08-12

  - okruh: doprava
    shrnuti: "V dopravě staví na dostavbě městského okruhu a parkovacích domech"
    postoj: >-
      Na zahájení pražské kampaně 13. září lídr podle ČTK uvedl, že v dopravě
      řadí mezi nejdůležitější projekty dostavbu městského okruhu a výstavbu
      parkovacích domů. Počet ani lokality parkovacích domů zpráva ČTK
      neuvádí.
    typZdroje: vyrok
    zdroj:
      text: Zahájení pražské kampaně ANO v Uhříněvsi (Pražský deník / ČTK)
      url: https://prazsky.denik.cz/komunalni-volby/kampan-ano-v-hlavnim-meste-startuje-v-uhrinevsi-program-miri-na-dopravu-i-sport/
      datum: 2026-09-13

  - okruh: bydleni
    shrnuti: "Do dvou let první stavby na městských pozemcích se soukromým sektorem; Airbnb registrace a limit dnů"
    postoj: >-
      Lídr chce z projektů Pražské developerské společnosti do dvou let
      udělat první stavby, se soukromým sektorem a městskými částmi, a měřit
      výsledek podle předaných bytů. Věří městské výstavbě, družstvům na
      městských pozemcích i developerům s pravidly. U krátkodobých pronájmů
      chce se státem prosadit povinnou registraci a limit dnů pro celé byty.
    typZdroje: vyrok
    zdroj:
      text: "Anketa: Jak chtějí pražští lídři řešit krizi bydlení (Echo24)"
      url: https://www.echo24.cz/a/H69UR/zpravy-domaci-anketa-echa-kandidati-na-primatora-praha-reseni-krize-bydleni-druzstva-developeri
      datum: 2026-09-19
    poznamka: >-
      Registrace a limit dnů jsou z ankety Echa24 o Airbnb ze 7. září 2026.
      Obojí vyžaduje změnu zákona, jak lídr sám uvádí („se státem dotáhneme
      zákonné zmocnění“). Cíl v počtu bytů lídr odmítá slibovat.

  - okruh: skolstvi
    shrnuti: "Velký středoškolský kampus se Středočeským krajem a státem, lokalita neurčená"
    postoj: >-
      Lídr navrhuje velký středoškolský kampus, který by Praha stavěla se
      Středočeským krajem a státem; i kapacita pro 6 000 míst by se podle něj
      zaplnila. Lokalitu neuvedl.
    typZdroje: vyrok
    zdroj:
      text: Po nemocnici i superškola. ANO navrhuje kampus pro tisíce středoškoláků (Pražský deník)
      url: https://prazsky.denik.cz/komunalni-volby/po-nemocnici-i-superskola-ano-navrhuje-kampus-pro-tisice-stredoskolaku/
      datum: 2026-09-21
    proveditelnost:
      kompetence: castecne
      rozpocet: nejiste
      cas: presahuje

  - okruh: doprava
    shrnuti: "Jedno rezidentní parkovací oprávnění pro celou Prahu přes den, bez dalšího poplatku"
    postoj: >-
      V anketě ČTK o reformě parkování lídr navrhl, aby jedno rezidentní
      oprávnění umožnilo Pražanům přes den parkovat bez dalšího poplatku i
      mimo jejich městskou část; večer a v noci mají mít přednost místní
      rezidenti.
    typZdroje: vyrok
    zdroj:
      text: Pražská koalice se nedohodla na cenách MHD ani parkování (Pražský patriot / ČTK)
      url: https://www.prazskypatriot.cz/prazska-koalice-se-v-tomto-obdobi-nedohodla-na-cenach-mhd-ani-parkovani/
      datum: 2026-09-20
    proveditelnost:
      agenda: parkovaci-zony
      kompetence: v-pravomoci
      rozpocet: nejiste
      cas: do-4-let
    poznamka: >-
      Zóny vymezuje magistrát nařízením. Kolik by město ztratilo na
      poplatcích, výrok neříká.
