# Koaliční smlouva STAN, SPOLU a Prahy sobě pro období 2026–2030.
#
# Text závazků je DOSLOVNĚ převzatý z dokumentu, který město zveřejnilo
# 19. 11. 2026 (Programové priority z koaliční smlouvy, 16 stran, PDF na
# praha.eu). Jedna odrážka dokumentu = jeden závazek; podbody „o“ jsou
# samostatné závazky. Nadpisy kapitol a oddílů jsou z dokumentu, id jsou naše.
# Do `zneni` se nesahá — oprava textu by z citace udělala parafrázi.
#
# Celé znění smlouvy (práva a povinnosti stran, rozdělení gescí, výbory)
# zveřejněné není; ČTK ho měla k dispozici, město ho nevydalo.
#
# `radni` u oddílu: kdo za oblast v radě odpovídá. Je to naše přiřazení —
# názvy kapitol odpovídají gescím, jak si je rada rozdělila 19. 11. (ČTK).
# Kde to jednoznačné není, zůstává prázdné.
#
# Analýza závazku (`analyza`) se doplňuje průběžně a jen se zdrojem:
#   - `hodnoceni` — proveditelnost ve stejném rámci jako u volebních programů
#     (kompetence, rozpočet, čas, historie, závěr; metodika /jak-hodnotime),
#   - `puvod` — ve kterém volebním programu 2026 slib stál,
#   - `plneni` — průběžný stav; BEZ-DOKLADU NENÍ NESPLNĚNO.
# Závazek bez `analyza` je neanalyzovaný, ne bezproblémový.

