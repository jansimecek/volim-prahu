# Rada hlavního města Prahy 2026–2030 — podklad pro sledování jednotlivých radních.
#
# Funkce, subjekt a gesce se tu NEPÍŠOU: jediný zdroj je `vedeni`
# v content/vyjednavani/magistrat.yaml (tam se mění i při rekonstrukci rady).
# Tady je jen to, co k člověku patří navíc:
#   - `kandidat` — slug z kandidátky ČSÚ (data/kandidatky/magistrat.json),
#     odtud věk a povolání uvedené při kandidatuře,
#   - `pusobeni` — doložené dřívější funkce, každá se zdrojem,
#   - `analyza` — rozbor práce radního; doplňuje se, až je z čeho.
# Shodu jmen s `vedeni` a existenci slugů hlídá `pnpm validate`.
#
# Do `pusobeni` jen funkce a fakta, žádné hodnocení. Kde se zdroje liší
# (věk, letopočty), se nepíše nic, dokud to nejde ověřit jinde.

