polozky:
  - id: vlastni-hmp
    skupina: tri-rozpocty
    nazev: Rozpočet vlastního hlavního města
    hodnota: příjmy 116,35 mld. · výdaje 119,05 mld. Kč
    rok: 2026
    stav: schvaleny
    zdrojTyp: primarni
    vysvetleni: >
      Peníze, se kterými hospodaří magistrát. Schodek 2,70 mld. Kč se kryje
      z prostředků minulých let, ne novým úvěrem. Tohle je číslo, proti kterému
      se poměřují celoměstské sliby.
    opora: [Z1]

  - id: konsolidovany
    skupina: tri-rozpocty
    nazev: Konsolidovaný rozpočet Prahy jako celku
    hodnota: příjmy 123,82 mld. · výdaje 132,23 mld. Kč
    rok: 2026
    stav: schvaleny
    zdrojTyp: primarni
    vysvetleni: >
      Součet 58 dílčích rozpočtů — magistrátu a všech 57 městských částí, po
      vyloučení vzájemných převodů. Schodek 8,41 mld. Kč. Tohle číslo se objevuje
      v titulcích nejčastěji, ale magistrát z něj přímo nedisponuje celou částkou.
    opora: [Z1]

  - id: soucet-mc
    skupina: tri-rozpocty
    nazev: Součet rozpočtů všech 57 městských částí
    hodnota: příjmy 19,24 mld. · výdaje 24,95 mld. Kč
    rok: 2026
    stav: schvaleny
    zdrojTyp: primarni
    vysvetleni: >
      Všechny radnice dohromady hospodaří s pětinou toho co magistrát. Záporné
      saldo 5,71 mld. Kč kryjí městské části z prostředků minulých let a z výnosů
      vlastní hospodářské činnosti.
    opora: [Z1]

  - id: kapitalove-vydaje
    skupina: investice
    nazev: Kapitálové (investiční) výdaje magistrátu
    hodnota: 23,03 mld. Kč z 119,05 mld.
    rok: 2026
    stav: schvaleny
    zdrojTyp: primarni
    vysvetleni: >
      Necelá pětina rozpočtu. Zbylých 96,02 mld. Kč jsou běžné výdaje — provoz
      dopravy, škol, sociálních služeb a úřadu. Když subjekt slíbí novou stavbu,
      soutěží o podíl na těchto 23 miliardách se všemi ostatními investicemi
      města, včetně metra D a čistírny odpadních vod.
    poznamka: >
      Vedení města představilo investice roku 2026 jako nejvyšší v historii.
      Jde o nominální srovnání neočištěné o inflaci a formulaci z tiskové zprávy
      k návrhu rozpočtu.
    opora: [Z1]

  - id: kapitalove-konsolidovane
    skupina: investice
    nazev: Kapitálové výdaje Prahy včetně městských částí
    hodnota: 30,65 mld. Kč
    rok: 2026
    stav: schvaleny
    zdrojTyp: primarni
    vysvetleni: >
      Konsolidovaně, tedy magistrát i všech 57 radnic. Samotné městské části
      z toho mají 7,79 mld. Kč, tedy 31,22 % svých výdajů.
    opora: [Z1]

  - id: kapitola-doprava
    skupina: investice
    nazev: Nejvyšší kapitola rozpočtu — doprava
    hodnota: 41,47 mld. Kč (34,8 % výdajů vlastního HMP)
    rok: 2026
    stav: schvaleny
    zdrojTyp: primarni
    vysvetleni: >
      Z toho 31,05 mld. Kč běžné výdaje (především provoz MHD) a 10,42 mld. Kč
      investice. Druhá největší kapitola je školství s 29,22 mld. Kč.
    poznamka: >
      Procentní podíly jsou odečtené z grafu v důvodové zprávě, v textu
      dokumentu uvedené nejsou. Absolutní částky ano.
    opora: [Z1]

  - id: fvz-celkem
    skupina: mestske-casti
    nazev: Peníze, které magistrát přiděluje městským částem
    hodnota: 10,53 mld. Kč
    rok: 2026
    stav: schvaleny
    zdrojTyp: primarni
    vysvetleni: >
      Finanční vztahy k městským částem. Meziročně o 3,40 mld. Kč více, přičemž
      89 % nárůstu tvoří posílení na nepedagogické pracovníky a ostatní neinvestiční
      výdaje ve školství. O výši rozhoduje Zastupitelstvo hl. m. Prahy — radnice
      si ji sama nepřidělí.
    opora: [Z2, Z1]

  - id: fvz-rozpeti
    skupina: mestske-casti
    nazev: Rozpětí mezi největší a nejmenší městskou částí
    hodnota: 936,4 mil. Kč (Praha 4) až 2,3 mil. Kč (Praha-Nedvězí)
    rok: 2026
    stav: schvaleny
    zdrojTyp: primarni
    vysvetleni: >
      Poměr 401 : 1. Rozdíl je z velké části dán počtem obyvatel — Praha 4 jich má
      143 958, Nedvězí 391 — takže na hlavu je rozdíl mnohem menší. Přesto platí,
      že slib srovnatelný v Praze 4 a v Nedvězí znamená úplně jinou zátěž.
    opora: [Z2]

  - id: zavislost-na-transferech
    skupina: mestske-casti
    nazev: Jak moc radnice závisí na penězích z magistrátu
    hodnota: 53 % až 70 % příjmů
    rok: 2026
    stav: schvaleny
    zdrojTyp: primarni
    vysvetleni: >
      Praha 13 má z magistrátu 70,4 % příjmů, Praha 9 57,3 %, Praha 8 57,1 %,
      Královice 53 %. Městské části navíc nejsou samostatnými příjemci sdílených
      daní — i zvýšení podílu obcí na daních jim přiteče až přes magistrát.
    opora: [M2, M6, M7, M9]

  - id: dluh-hmp
    skupina: dluh
    nazev: Dluh vlastního hlavního města
    hodnota: 4,75 mld. Kč
    rok: 2025
    stav: skutecnost
    zdrojTyp: primarni
    vysvetleni: >
      Stav k 31. 12. 2025, meziročně o 609 mil. Kč nižší. Tvoří ho výhradně čtyři
      úvěry od Evropské investiční banky. V roce 2025 si Praha nepůjčila nic nového
      a rozpočet na rok 2026 nepočítá s vydáním dluhopisů.
    opora: [Z3, Z1]

  - id: dluhova-sluzba
    skupina: dluh
    nazev: Co dluh ročně stojí
    hodnota: 608,9 mil. Kč jistiny + 196,6 mil. Kč úroky
    rok: 2025
    stav: skutecnost
    zdrojTyp: primarni
    vysvetleni: >
      Splátky jistin ve stejné výši (602,8 mil. Kč ročně) plánuje rozpočet i pro
      roky 2026 až 2029. Proti rozpočtu 119 mld. Kč jde o zlomek — dluhová služba
      není to, co by Praze svazovalo ruce.
    opora: [Z3, Z1]

  - id: vyhled-prijmy
    skupina: vyhled
    nazev: Očekávané příjmy ve volebním období
    hodnota: 130,4 → 131,4 → 132,5 mld. Kč (2027–2029)
    rok: 2026
    stav: vyhled
    zdrojTyp: primarni
    vysvetleni: >
      Střednědobý výhled schválený spolu s rozpočtem. Počítá s mírným růstem
      a výslovně nepočítá se zapojením cizích zdrojů ani úspor z minulých let.
    opora: [Z1]

  - id: vyhled-investice
    skupina: vyhled
    nazev: Plánovaný pokles investic
    hodnota: 28,97 → 28,52 → 27,51 mld. Kč (2027–2029)
    rok: 2026
    stav: vyhled
    zdrojTyp: primarni
    vysvetleni: >
      Konsolidované kapitálové výdaje ve výhledu klesají. Nové velké investiční
      sliby by tedy musely buď vytlačit něco jiného, nebo přinést nový zdroj
      financování.
    poznamka: >
      Výhled od roku 2027 zahrnuje pouze výdaje kryté vlastními příjmy, ne
      zapojení úspor. Pokles proto vypadá strmější, než jaký ve skutečnosti bude.
    opora: [Z1]

  - id: skutecnost-2025
    skupina: vyhled
    nazev: Jak dopadl poslední uzavřený rok
    hodnota: přebytek 24,17 mld. Kč
    rok: 2025
    stav: skutecnost
    zdrojTyp: primarni
    vysvetleni: >
      Praha jako celek měla příjmy 148,14 mld. a výdaje 123,97 mld. Kč. Vlastní
      hlavní město skončilo v přebytku 22,49 mld. Kč, přestože schválený rozpočet
      počítal se schodkem 2,56 mld. Přebytky se opakují — 22,96 mld. v roce 2024,
      29,27 mld. v roce 2023. Rozpočtovaný schodek proto neznamená, že Praze
      peníze chybí.
    opora: [Z1, Z3]

