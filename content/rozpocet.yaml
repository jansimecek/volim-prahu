# Rozpočtový rámec — opora osy „rozpočet" v hodnocení proveditelnosti.
#
# Smysl: když subjekt slíbí „postavíme za dvě miliardy", je to hodně, nebo málo?
# Bez řádových čísel je odpověď dojem. Tady jsou čísla se zdrojem.
#
# stav: schvaleny | skutecnost | vyhled | navrh   — POZOR, tohle se plete nejčastěji
# zdrojTyp: primarni | sekundarni

uvodniVarovani: >
  V Praze existují tři různá čísla, kterým se říká „rozpočet Prahy", a liší se
  o desítky miliard. Kdo je zamění, dojde k nesmyslu. Rozdíl vysvětlujeme hned
  v první sekci a v celém textu důsledně uvádíme, o který z nich jde.

skupiny:
  - id: tri-rozpocty
    nadpis: Tři rozpočty, které se pletou
    popis: >
      Vlastní hlavní město, konsolidovaný celek a součet městských částí. Než
      začnete porovnávat jakýkoli slib s „rozpočtem Prahy", je potřeba vědět,
      o který z nich jde.
  - id: investice
    nadpis: Kolik zbývá na investice
    popis: >
      Běžné výdaje jsou provoz, který nejde vypnout. Rozhodovací prostor pro
      nové stavby je v kapitálových výdajích — a ten je řádově menší, než
      celkové číslo rozpočtu napovídá.
  - id: mestske-casti
    nadpis: Co má k dispozici městská část
    popis: >
      Rozpočty městských částí se liší v řádech a stojí především na penězích,
      které jim přidělí magistrát. To je klíčové pro posouzení slibů na radnicích.
  - id: dluh
    nadpis: Dluh a jeho obsluha
    popis: >
      Praha je na poměry velkých měst zadlužená málo, což rozšiřuje prostor pro
      investice financované úvěrem — pokud se pro ně zastupitelstvo rozhodne.
  - id: vyhled
    nadpis: Výhled na volební období
    popis: >
      Volební období 2026–2030 spadá do střednědobého výhledu schváleného
      spolu s rozpočtem. Ukazuje, s čím město samo počítá.

