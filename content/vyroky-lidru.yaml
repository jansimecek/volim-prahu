osoby:
  - osobaSlug: husbauer-jan
    jmeno: "Jan Hušbauer"
    subjekt: ano-2011
    vyroky:
      - tema: "Doprava a MHD"
        citace: "Roční kupon pro Pražany zdražovat nebudeme."
        kontext: "Odpověď v anketě mezi kandidáty na primátora na otázku, jestli po volbách zdraží městská hromadná doprava."
        zdroj: echo-mhd
      - tema: "Městské firmy"
        citace: "Praha má na účtech přes 180 miliard a problém dopravního podniku není málo peněz od cestujících, ale hospodaření — nejdřív vnitřní úspory a kontrola zakázek, pak se teprve můžeme bavit o cenách jízdenek pro návštěvníky."
        kontext: "V téže anketě vysvětluje, proč podle něj nemá být zdražení jízdného prvním krokem k řešení financí Dopravního podniku."
        zdroj: echo-mhd
      - tema: "Doprava a MHD"
        citace: "Zvýhodněné jízdné seniorů a osob v nepříznivé sociální situaci jsou pro nás nedotknutelné."
        kontext: "V téže anketě vymezuje, které slevy na jízdném by jeho hnutí neměnilo."
        zdroj: echo-mhd
      - tema: "Rozpočet a investice"
        citace: "Co udělám: do sta dnů necháme udělat tvrdý audit harmonogramu a financování"
        pokracovani: " s Dopravním podnikem, zveřejníme závazný investiční plán…"
        kontext: "Reakce na aktuální termín zprovoznění metra D — popisuje, co by jako primátor udělal s řízením téhle investice."
        zdroj: echo-metro
      - tema: "Doprava a MHD"
        citace: "Nebudu vám tady od stolu házet datum — přesně to dělali politici před námi"
        pokracovani: " a výsledkem je, že termíny metra D nikdo nebere vážně."
        kontext: "Odmítá slíbit konkrétní datum dokončení metra D."
        zdroj: echo-metro
      - tema: "Povolební spolupráce"
        citace: "My v tuhletu chvíli nevylučujeme tuto spolupráci (se Spolu)"
        pokracovani: " pro nás budou důležité programové záležitosti, jestli je dokážeme plnit, a stejně tak i náš koaliční partner."
        kontext: "V debatě Poledne s Moravcem odpovídal na otázku po možné povolební spolupráci se SPOLU na pražském magistrátu."
        poznamka: "Upřesnění „(se Spolu)“ doplnila v závorce ČTK, aby bylo zřejmé, o koho jde. Titulky, podle kterých Hušbauer spolupráci „nevyloučil“, jsou nepřímá řeč novináře — doslova řekl „nevylučujeme“."
        zdroj: ctk-koalice
      - tema: "Volební cíl"
        citace: "Chci udržet minimálně ten výsledek, který jsme měli čtyři roky zpátky"
        kontext: "V téže debatě odpovídal na otázku, jaký výsledek považuje v Praze za úspěch."
        zdroj: ctk-koalice
      - tema: "Povolební spolupráce"
        citace: "Koaliční jednání v Praze povedu já. Celostátní politika nás v Praze neomezuje a neměla by omezovat"
        kontext: "V rozhovoru pro CNN Prima News o povolebních jednáních v Praze a o roli celostátního vedení ANO."
        zdroj: cnn-husbauer
      - tema: "Povolební spolupráce"
        citace: "U povolebního vyjednávání o koalicích mám jednoduchou podmínku – program a způsob řízení"
        kontext: "V témže rozhovoru jmenoval podmínku, na které podle něj bude povolební spolupráce záviset."
        poznamka: "Titulek rozhovoru, podle kterého Hušbauer koalici s ODS „nevyloučil“, je formulace redakce, ne jeho věta."
        zdroj: cnn-husbauer
      - tema: "Povolební spolupráce"
        citace: "Rozhodně se nedomluvím s tím, kdo chce pokračovat ve stylu posledních osmi let"
        kontext: "V témže rozhovoru o tom, s kým by se po volbách nedomluvil."
        zdroj: cnn-husbauer
      - tema: "Povolební spolupráce"
        citace: "Já v Praze půjdu do koalice s tím, kdo dokáže plnit naše programové prohlášení."
        pokracovani: " A primárně s tím, kdo se mnou bude chtít řešit nedostupné bydlení v Praze, dopravu, obnovu sportovních ploch, obnovu sídlišť a veškeré tyhle důležité věci pro Prahu a pro Pražany."
        kontext: "Na zahájení pražské kampaně ANO v Uhříněvsi pro ČTK."
        zdroj: ctk-uhrineves
      - tema: "Rozpočet a investice"
        citace: "Pro mě je největší priorita, aby se Praha rozvíjela, aby se do ní investovalo - do všech oblastí, ve kterých je to potřeba, ať je to doprava, bezpečnost, bydlení, školství nebo sport"
        kontext: "Na zahájení pražské kampaně ANO v Uhříněvsi pro ČTK."
        zdroj: ctk-uhrineves
      - tema: "Rozpočet a investice"
        citace: "Tempo za poslední čtyři roky nijak nevidím. Praha má téměř 200 miliard korun. To jsou peníze, které nejsou investované a neslouží lidem k bydlení"
        kontext: "V debatě kandidátů na primátora na Summitu dostupného bydlení a stavebního rozvoje kritizoval dosavadní tempo investic města."
        zdroj: pd-summit
        poznamka: "Výše prostředků na účtech města je tvrzení kandidáta."
      - tema: "Doprava a parkování"
        citace: "Jedno rezidentní oprávnění má Pražanům přes den umožnit parkovat bez dalšího poplatku i mimo jejich městskou část, večer a v noci však musí mít přednost místní rezidenti"
        kontext: "Odpověď v anketě ČTK mezi lídry kandidátek o reformě parkování."
        zdroj: ctk-parkovani
      - tema: "Bezpečnost"
        citace: "Potřebujeme nabrat strážníky"
        kontext: "V předvolebním duelu Novinek s Tomášem Portlíkem o bezpečnosti; strážníky chce město podle něj motivovat například dostupným bydlením."
        zdroj: novinky-duel-bezpecnost
      - tema: "Bezpečnost"
        citace: "Já nic neslibuju, já říkám řešení, které by tomu pomohlo"
        kontext: "V témže duelu na dotaz Novinek k návrhu, aby se alkohol po desáté večer prodával jen v barech a restauracích, ne ve večerkách. Připustil, že by to vyžadovalo změnu zákona a spolupráci se státem."
        zdroj: novinky-duel-bezpecnost
        poznamka: "Samotný návrh popisují Novinky vlastními slovy, ne citací. Omezit prodej alkoholu podle denní doby Praha sama nemůže; jak uvádí i kandidát, šlo by to jen změnou zákona."
      - tema: "Rozpočet a investice"
        citace: "Já říkám, že to není našetřeno, je to neproinvestováno. Jsou to peníze, které patří Pražanům"
