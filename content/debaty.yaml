# Kalendář debat kandidátů na pražského primátora ve velkých médiích.
#
# Zapisuje se jen debata, jejíž termín ohlásil pořadatel nebo ho uvádí článek
# média, a vždy s odkazem na to ohlášení. Čas a místo se neodhadují: když je
# pořadatel neuvedl, pole zůstane prázdné a web napíše, že čas zatím neznáme.
#
# `ucastnici` jsou slugy osob z kandidátních listin (jméno se bere z dat ČSÚ).
# Prázdný seznam znamená, že složení pořadatel nezveřejnil — ne že nikdo
# nepřijde. Kdo přijal pozvání, se píše podle ohlášení, ne podle toho, kdo
# nakonec dorazil; rozdíl patří do `poznamka`.
#
# Debaty, u kterých médium ohlásilo jen období, ale ne den, jsou v `bezTerminu`.

overeno: 2026-09-26

