# Programové prohlášení Rady hl. m. Prahy 2022–2026 a jeho ověřitelnost.
#
# Opora osy „historie" v hodnocení proveditelnosti: abychom mohli u nového
# slibu říct, jestli ho subjekt v minulém období splnil, musí existovat
# srovnatelný minulý slib — a ten musí jít ověřit.
#
# stav: splneno | castecne | nesplneno | bez-dokladu
#
# BEZ-DOKLADU NENÍ NESPLNĚNO. Je to přiznání, že jsme výsledek nedohledali.
# Zaměnit to znamená obvinit konkrétní lidi z něčeho, co jsme neprokázali.

dokument:
  nazev: Programové prohlášení koalice SPOLU pro Prahu, Pirátské strany a hnutí Starostové a nezávislí
  vydano: 2023-06
  stran: 62
  url: https://praha.eu/documents/d/praha/programove_prohlaseni_2023_3600794

mereni:
  zavazkuCelkem: 576
