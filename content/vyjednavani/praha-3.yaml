udalosti:
  - id: top-stan-hledaji-partnera
    datum: 2026-10-12
    typ: jednani
    subjekty: [top-09-starostove-a-nezavisli-s-podporou-zizkov-nejen-sobe, pirati-praha-3-sobe-a-edita-janeckova]
    sestava: [top-09-starostove-a-nezavisli-s-podporou-zizkov-nejen-sobe, pirati-praha-3-sobe-a-edita-janeckova]
    kdo: Michal Vronský, lídr a dosavadní starosta (TOP 09)
    doklad: citace
    citace: >-
      V nově ustanoveném zastupitelském klubu TOP 09 a Starostové jsme se
      domluvili, že budeme hledat koaličního partnera a že jako první povedeme
      jednání s koalicí vedenou Editou Janečkovou.
    shrnuti: >-
      TOP 09 se STAN mají v Praze 3 většinu sami (18 z 35), přesto hledají
      partnera. Jako první jednají s kandidátkou Pirátů a Prahy 3 sobě, kterou
      vedla Edita Janečková.
    zdroje: [pd-praha3-12-10]

  - id: dohoda-top-stan-pirati-ps3
    datum: 2026-11-10
    typ: dohoda
    subjekty: [top-09-starostove-a-nezavisli-s-podporou-zizkov-nejen-sobe, pirati-praha-3-sobe-a-edita-janeckova]
    sestava: [top-09-starostove-a-nezavisli-s-podporou-zizkov-nejen-sobe, pirati-praha-3-sobe-a-edita-janeckova]
    kdo: Michal Vronský (TOP 09), starosta a lídr
    doklad: citace
    citace: >-
      Koalice 24 zastupitelů z 35 bude dostatečně stabilní.
    shrnuti: >-
      TOP 09 a STAN, které mají samy většinu 18 z 35, podle Vronského
      finalizují koalici s kandidátkou Pirátů, Prahy 3 sobě a Edity
      Janečkové (6 mandátů). Potvrdit ji má ustavující zasedání 18.
      listopadu; Vronský má zůstat starostou.
    zdroje: [pd-praha3-10-11]

  - id: volba-vronsky
    datum: 2026-11-18
    typ: volba
    subjekty: [top-09-starostove-a-nezavisli-s-podporou-zizkov-nejen-sobe, pirati-praha-3-sobe-a-edita-janeckova]
    sestava: [top-09-starostove-a-nezavisli-s-podporou-zizkov-nejen-sobe, pirati-praha-3-sobe-a-edita-janeckova]
    kdo: Michal Vronský (TOP 09), starosta
    doklad: parafraze
    shrnuti: >-
      Starostou podruhé zvolen Vronský (26 hlasů); koalice TOP 09 a STAN s
      Piráty a Prahou 3 sobě má 24 z 35. Místostarostů je pět. Uvolnění budou
      i předsedové nových výborů pro IT a inovace a pro životní prostředí.
      Priority: kapacity škol, veřejný prostor, Nákladové nádraží Žižkov,
      dostupné bydlení pro mladé rodiny.
    zdroje: [pd-praha3-volba-18-11]
