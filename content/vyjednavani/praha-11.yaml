    kdo: Martin Sedeke (ODS), dosavadní starosta
    doklad: citace
    citace: >-
      Není úplně jisté, že budeme mít prosincové zastupitelstvo.
    shrnuti: >-
      Zastupitelé složili slib a na Sedekeho návrh (31 z 35) vyřadili z
      programu volbu starosty a rady — koalice zatím nevznikla. ANO
      jedná se všemi pěti subjekty. Další zasedání bude v prosinci,
      možná až v lednu; podle Sedekeho záleží i na tom, jak rozpočet
      schválí magistrát.
