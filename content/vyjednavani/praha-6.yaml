udalosti:
  - id: dohoda-stan-ps6-ods
    datum: 2026-10-11
    typ: dohoda
    subjekty: [starostove-a-nezavisli, praha-6-sobe, ods-a-kdu-csl]
    sestava: [starostove-a-nezavisli, praha-6-sobe, ods-a-kdu-csl]
    kdo: Petr Prokop a Jan Lacina (STAN)
    doklad: citace
    citace: >-
      Věřím, že jsme vyjednali koalici, která bude stabilní a naváže na
      dosavadní práci rady. Budu starosta Prahy 6 a upřímně se na tu práci
      těším.
    shrnuti: >-
      STAN, Praha 6 sobě a ODS s KDU-ČSL se v neděli dohodli na pokračování
      koalice (32 mandátů z 45). Starostou má být Petr Prokop (STAN) místo
      Jakuba Stárka (ODS). Nic podepsaného zatím není: „Rozdělení křesel
      musejí ještě potvrdit zastupitelské kluby,“ řekl Lacina.
    zdroje: [drbna-praha6-12-10, pd-praha6-11-10]

  - id: memorandum-stan-ps6-ods
    datum: 2026-10-13
    typ: memorandum
    subjekty: [starostove-a-nezavisli, praha-6-sobe, ods-a-kdu-csl]
    sestava: [starostove-a-nezavisli, praha-6-sobe, ods-a-kdu-csl]
    kdo: zástupci STAN, Prahy 6 sobě a ODS s KDU-ČSL
    doklad: parafraze
    shrnuti: >-
      V úterý podepsali memorandum o koaliční spolupráci; kluby s dohodou
      souhlasily. Starostou má být Petr Prokop (STAN), statutární
      místostarostkou Mariana Čapková (Praha 6 sobě), místostarosty Jakub
      Stárek a Václav Kožený (ODS), Petr Palacký (Zelení) a Jan Lacina (STAN).
      Koaliční smlouvu chtějí podepsat do listopadového zasedání.
    zdroje: [pd-praha6-memorandum-13-10, drbna-praha6-14-10]

