    doklad: citace
    citace: >-
      Nabídka společné koalice je na stole již několik dnů. Věříme, že
      Starostové a TOP 09 tuto příležitost využijí a společně s námi a Piráty
      umožní vznik nového vedení Prahy 8.
    shrnuti: >-
      8žije opakuje nabídku koalice se STAN a TOP 09 a s Piráty (25 ze 45)
