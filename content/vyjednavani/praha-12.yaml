    datum: 2026-11-24
    typ: vyjadreni
    subjekty: [praha-12-sobe]
    kdo: Adam Scheinherr, předseda Prahy sobě
    doklad: parafraze
    shrnuti: >-
      Celopražská Praha sobě vyloučila zastupitele Veronu Ballay a Jakuba
      Macka, protože uzavřeli koalici s ANO proti vůli vedení strany. Oba
      tvrdí, že vyloučení ještě není konečné a koalice byla nejlepší reálnou
      variantou.
    zdroje: [pd-praha12-vylouceni-24-11]
