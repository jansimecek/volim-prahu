      Výsledek zatím nemáme.
    shrnuti: >-
      Vítězná ODS (10 mandátů z 35) jedná se všemi stranami v zastupitelstvu.
      Kos chce ve funkci starosty pokračovat. V minulém období vládla ODS
      s TOP 09 a ANO; jestli spolupráce pokračuje, zatím není jasné.
    zdroje: [pd-prehled-15-10]

