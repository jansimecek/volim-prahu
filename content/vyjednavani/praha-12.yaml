    kdo: Vojtěch Kos (ODS), starosta
    doklad: parafraze
    shrnuti: >-
      Koaliční smlouvu ODS, ANO a Prahy 12 sobě strany podle Kose podepsaly ve
      středu, asi půl hodiny před zasedáním. Proti dosavadní koalici nahradila
      TOP 09 Praha 12 sobě; koalice má 20 z 35.
    zdroje: [pd-praha12-volba-18-11]

  - id: volba-kos
    datum: 2026-11-18
    typ: volba
    subjekty: [obcanska-demokraticka-strana, ano-2011, praha-12-sobe]
    kdo: Vojtěch Kos (ODS), starosta
    doklad: parafraze
    shrnuti: >-
      Starostou znovu zvolen Kos. Rada má devět členů: starostu, čtyři
      místostarosty a čtyři radní; radní Černou, Moravce a Michálka zdroj
      uvádí jen příjmením, proto je v seznamu nevypisujeme. Koalici s ANO
      kritizovali Piráti, TOP 09, Zelení i Změna pro Prahu 12.
    zdroje: [pd-praha12-volba-18-11]

