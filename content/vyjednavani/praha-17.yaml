udalosti:
  - id: dohoda-repsti-sousede-stan
    datum: 2026-10-16
    typ: dohoda
    subjekty: [repsti-sousede, starostove-a-nezavisli]
    sestava: [repsti-sousede, starostove-a-nezavisli]
    kdo: Lukáš Pokorný, lídr Řepských sousedů
    doklad: citace
    citace: >-
      Jako kolegy do vznikající rady jsme si vybrali nově zvolené zastupitele
      za místní sdružení STAN, kteří nám za současné situace nejlépe umožní
      plnit sliby, které jsme před volbami dali.
    shrnuti: >-
      Vítězní Řepští sousedé (9 mandátů) se dohodli se STAN (4), dohromady
      mají 13 z 23. Obě strany začaly připravovat koaliční smlouvu. Radnici
      dosud vedla koalice ODS, ANO a Řep sobě.
    zdroje: [pd-praha17-16-10]

  - id: volba-pokorny
    datum: 2026-11-04
    typ: volba
    subjekty: [repsti-sousede, starostove-a-nezavisli]
    kdo: Lukáš Pokorný (Řepští sousedé), starosta
    doklad: citace
    citace: >-
      Velmi si toho vážím a vnímám to jako obrovský závazek. Budu starostou
      všech občanů Řep bez ohledu na to, komu ve volbách dali svůj hlas.
    shrnuti: >-
      Zastupitelé zvolili starostou Lukáše Pokorného, lídra vítězných
      Řepských sousedů; z 23 lístků bylo platných 14. Koalice Řepských sousedů
      a STAN, ODS a ANO jdou do opozice. Zvoleni byli i tři místostarostové.
    zdroje: [pd-praha17-4-11]
