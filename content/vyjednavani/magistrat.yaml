    datum: 2026-10-10
    typ: vyjadreni
    subjekty: [spolu-pro-prahu]
    kdo: Tomáš Portlík, lídr kandidátky
    doklad: citace
    citace: >-
      Úvahy o koalicích jsou předčasné, ale nevylučuji různé varianty.
