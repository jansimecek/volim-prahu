      zasedání zastupitelstva. Za jednu z variant označil koalici se SPOLU,
      STAN a Piráty.
    zdroje: [denikn-10-10, ct24-10-10, cnn-11-10]

  - id: pirati-mestotvorna
    datum: 2026-10-10
    typ: vyjadreni
    subjekty: [ceska-piratska-strana]
    sestava: [starostove-a-nezavisli, praha-sobe, ceska-piratska-strana]
    kdo: Tereza Nislerová, lídryně kandidátky
    doklad: citace
    citace: >-
      Je důležité, že v tuto chvíli je možné sestavit ‚městotvornou‘ koalici,
      ke které jsme vyzývali, a která by byla složená na platformě STAN, Prahy
      sobě a Pirátů.
    shrnuti: >-
      Piráti chtějí koalici se STAN a Prahou sobě (38 mandátů). V neděli
      11. 10. měli ustavit klub a vyjednávací strategii; jako první se obrátí
      na STAN a Prahu sobě.
    zdroje: [cnn-11-10, ct24-10-10]

