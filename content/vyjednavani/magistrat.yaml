    datum: 2026-10-10
    typ: vyjadreni
    subjekty: [spolu-pro-prahu]
    kdo: Tomáš Portlík, lídr kandidátky
    doklad: citace
    citace: >-
      Že bychom si od Pirátů rádi odpočinuli, stále platí.
    shrnuti: >-
      Portlík zopakoval, že SPOLU nechce pokračovat v koalici s Piráty.
      Skeptický byl i k Praze sobě: „Ať jsem fér, tak ani nevím, jak by to
      vypadalo čtyři roky v koalici s Prahou sobě.“ Spolupráci s nimi ale
      nevyloučil.
    zdroje: [cnn-11-10, ct24-10-10]

  - id: praha-sobe-jedna-se-spolu
    datum: 2026-10-10
    typ: jednani
    subjekty: [praha-sobe, spolu-pro-prahu]
