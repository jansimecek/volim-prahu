      s oběma sejde odděleně. Podle Pražského deníku mají jednání upřesnit,
      jestli bude koalice dvoj-, troj-, nebo čtyřčlenná.
    zdroje: [prahain-13-10, pd-pilire-13-10]

  - id: hlavacek-bez-spolu-nepravdepodobne
    datum: 2026-10-13
    typ: vyjadreni
    subjekty: [starostove-a-nezavisli]
    kdo: Petr Hlaváček, lídr kandidátky
    doklad: citace
    citace: >-
      Matematicky to není vyloučené, ale myslím, že je to dost
      nepravděpodobné.
    shrnuti: >-
      Hlaváček o koalici STAN, Prahy sobě a Pirátů bez SPOLU. Už v pondělí ji
      označil za „velmi nepravděpodobnou“. Koalice jen se SPOLU by podle něj
      byla křehká, čtyřkoalice široká, ale možná ne funkční.
    zdroje: [prahain-13-10, pd-dvojspolek-12-10, pd-biskup-11-10]

  - id: ano-jen-kontrolni-funkce
    datum: 2026-10-13
    typ: vyjadreni
    subjekty: [starostove-a-nezavisli, spolu-pro-prahu]
    kdo: Petr Hlaváček (STAN), Alexandra Udženija (ODS)
    doklad: citace
    citace: >-
      Kontrolní výbor patří prioritně opozici.
    shrnuti: >-
      Hlaváček se s ANO sejde „ze slušnosti“, ne kvůli koalici — nejspíš
      půjde o kontrolní funkce. Schůzku s ANO potvrdila i předsedkyně pražské
      ODS Udženija; o vstupu ANO do koalice podle ní nemůže být řeč.
    zdroje: [prahain-13-10, pd-pilire-13-10]

  - id: stan-praha-sobe-ramec
    datum: 2026-10-13
    typ: jednani
    subjekty: [starostove-a-nezavisli, praha-sobe]
    kdo: Petr Hlaváček a Adam Scheinherr
    doklad: citace
    citace: >-
      Řekli jsme si takový základní rámec případné spolupráce. Probírali jsme
      i gesce, ne personálně, ale zhruba ten zájem.
    shrnuti: >-
      Scheinherr by preferoval koalici STAN, Prahy sobě a Pirátů: „Vnímáme, že
      je tam největší programová shoda a že by ta koalice měla nejméně hádek.“
      Do dvojkoalice jen se SPOLU se STAN podle Hlaváčka příliš nechce: „Ale
      nemůžeme to v tuto chvíli vyloučit.“ Další schůzka koncem týdne nebo
      začátkem příštího.
    zdroje: [pd-stan-ps-13-10]

  - id: stan-pirati-ramec
    datum: 2026-10-13
    typ: jednani
    subjekty: [starostove-a-nezavisli, ceska-piratska-strana]
    kdo: Petr Hlaváček a Tereza Nislerová
    doklad: citace
    citace: >-
      Velmi podobně jsme probrali rámec případné spolupráce, bavili jsme se
      o gescích, ne personálně, a máme nějakou rámcovou představu, co by si
      kolegové Piráti představovali.
    shrnuti: >-
      Pro Piráty je podle Nislerové zásadní městská bytová výstavba; na té by
      se podle Hlaváčka dalo dohodnout. V opozici by Piráti chtěli prosazovat
      své priority a nastavovat koalici zrcadlo. Další schůzka v pátek nebo
      v pondělí.
    zdroje: [pd-pristi-tyden-13-10, drbna-pristi-tyden-13-10]

  - id: stan-format-pristi-tyden
    datum: 2026-10-13
    typ: vyjadreni
    subjekty: [starostove-a-nezavisli]
    kdo: Petr Hlaváček, lídr kandidátky
    doklad: citace
    citace: >-
      Příští týden bychom chtěli představit rámec spolupráce a jít do většího
      detailu.
    shrnuti: >-
      Po schůzkách se všemi partnery chce STAN oznámit, o jakém formátu
      koalice bude jednat dál. Se SPOLU se tým znovu sejde ve čtvrtek 15. 10.
      Ve hře je podle ČTK hlavně dvojkoalice STAN a SPOLU, případně doplněná
      o Prahu sobě, Piráty, nebo obě uskupení.
    zdroje: [pd-pristi-tyden-13-10, drbna-pristi-tyden-13-10]

  - id: stan-spolu-program-finance
    datum: 2026-10-15
    typ: jednani
    subjekty: [starostove-a-nezavisli, spolu-pro-prahu]
    sestava: [starostove-a-nezavisli, spolu-pro-prahu]
    kdo: Petr Hlaváček (STAN) a Tomáš Portlík (SPOLU)
    doklad: citace
    citace: >-
      Máme shodu v tom, co se má stavět, dopravní infrastruktura, školství
      a bydlení.
    shrnuti: >-
      Druhé jednání STAN a SPOLU, tentokrát o programu. Sporná je gesce
      financí: „V čem máme nejasnost, je, kdo drží finance,“ řekl Hlaváček.
      Podle Portlíka si obě strany chtějí nechat dosavadní gesce — STAN územní
      rozvoj a školství, SPOLU infrastrukturu, sociální věci a zdravotnictví.
      O dopravě rozhodne i případný třetí partner.
    zdroje: [pd-finance-15-10, ctk-prehled-16-10]

  - id: spolu-bez-tretiho
    datum: 2026-10-15
    typ: vyjadreni
    subjekty: [spolu-pro-prahu]
    kdo: Tomáš Portlík, lídr SPOLU
    doklad: citace
    citace: >-
      My k tomu nevidíme důvod, my jsme se vyjádřili jasně, že je pro nás
      preferovaná varianta koalice SPOLU a STAN.
    shrnuti: >-
      SPOLU se s Prahou sobě ani s Piráty znovu scházet nehodlá. O přizvání
      třetího partnera má podle Portlíka rozhodnout STAN jako vítěz voleb.
    zdroje: [pd-finance-15-10]

  - id: stan-nabidka-pondeli
    datum: 2026-10-15
    typ: vyjadreni
    subjekty: [starostove-a-nezavisli]
    kdo: Petr Hlaváček, lídr kandidátky
    doklad: citace
    citace: >-
      Myslím, že vám brzy řekneme, jestli směřujeme ke dvojkolejné nebo
      trojkolejné verzi.
    shrnuti: >-
      Hlaváček se přiklání k širší koalici než jen se SPOLU (34 hlasů z 65).
      Začátkem příštího týdne STAN znovu jedná s Piráty a s Prahou sobě: „My
      přijdeme s nějakou nabídkou a uvidíme, jak kolegové budou reagovat.“
      Koaliční smlouvu chce mít podepsanou v listopadu.
    zdroje: [pd-finance-15-10, ctk-prehled-16-10]

  - id: stan-nabidka-piratum
    datum: 2026-10-19
    typ: jednani
    subjekty: [starostove-a-nezavisli, ceska-piratska-strana]
    kdo: Petr Hlaváček (STAN) a Tereza Nislerová (Piráti)
    doklad: citace
    citace: >-
      Dopravu nyní vyžadovat nebudeme, přestože si myslím, že jsme ji věcně
      posunuli dobrým směrem.
    shrnuti: >-
      STAN předložil Pirátům nabídku: místa v radě a předsednictví výborů.
      Piráti odpoví do středečního večera; zásadní je pro ně gesce bydlení,
      dopravu chtít nebudou (řekla Nislerová). STAN jedná ve středu s Prahou
      sobě a ve čtvrtek se SPOLU. O koaličním formátu má být podle Hlaváčka
      jasno v pátek, rozhodne i klub STAN.
    zdroje: [pd-nabidka-piratum-19-10]

  - id: hlavacek-trojkoalice-finance
    datum: 2026-10-19
    typ: vyjadreni
    subjekty: [starostove-a-nezavisli]
    kdo: Petr Hlaváček, lídr kandidátky
    doklad: citace
    citace: >-
      Myslím, že bude jeden gesční radní a bude nějaká přátelská dohoda, že to
      není všechno.
    shrnuti: >-
      Hlaváček zopakoval, že preferuje trojkoalici. K nevyřešené gesci financí
      se SPOLU řekl, že zodpovědnost za hospodaření města by se měla nějak
      rozdělit; po dohodě by ji STAN mohl přenechat partnerovi. Postup
      konzultuje s předsedou STAN Rakušanem, pokyny od něj ale nedostává.
    zdroje: [pd-nabidka-piratum-19-10]

  - id: praha-sobe-nabizi-primatora
    datum: 2026-10-20
    typ: vyjadreni
    subjekty: [praha-sobe]
    sestava: [starostove-a-nezavisli, praha-sobe, ceska-piratska-strana]
    kdo: Adam Scheinherr, předseda Prahy sobě (na facebooku)
    doklad: citace
    citace: >-
      Koalice STAN, Praha sobě a Piráti je za nás koalicí s nejvyšším možným
      programovým průnikem, což znamená nejméně hádek a funkční koalici pro
      další čtyři roky, která bude schopna posouvat důležitá rozhodnutí
      a doručovat výsledky pro naše město.
    shrnuti: >-
      Praha sobě nabídla STAN v koalici s Piráty (37 mandátů) post primátora
      a šest z 11 míst v radě; sama by měla tři, Piráti dvě. Koalici STAN,
      SPOLU a Prahy sobě nevylučuje, ale jen se zárukami k dopravě a městskému
      bydlení. Ve středu odpoledne se schází s týmem STAN, který jí přednese
      vlastní nabídku, a pak s Piráty.
    zdroje: [ctk-praha-sobe-nabidka-20-10]
