udalosti:
  - id: stan-jedna-se-tremi
    datum: 2026-10-10
    typ: vyjadreni
    subjekty: [starostove-a-nezavisli]
    kdo: Petr Hlaváček, lídr kandidátky
    doklad: citace
    citace: >-
      Určitě se sejdeme se Spolu, Prahou sobě a Piráty. Budeme jednat
      o jejich prioritách.
    shrnuti: >-
      Vítězné STAN chce o koalici jednat podle pořadí ve volbách: nejdřív se
      SPOLU, pak s Prahou sobě a nakonec s Piráty. Podle ČT24 Hlaváček dodal,
      že širokou koalici „asi nemůžeme vyloučit, ale je to věc nějakého
      jednání“.
    zdroje: [cnn-11-10, ct24-10-10, pd-10-10, prahain-11-10]

  - id: stan-vylucuje-ano
    datum: 2026-10-10
    typ: vylouceni
    subjekty: [starostove-a-nezavisli]
    vylucuje: [ano-2011]
    kdo: Petr Hlaváček, lídr kandidátky
    doklad: parafraze
    shrnuti: >-
      Hlaváček na volební tiskové konferenci vyloučil spolupráci s hnutím ANO,
      stejně jako už před volbami.
    zdroje: [ct24-10-10, echo-10-10]

  - id: rakusan-ne-dvoubarevna
    datum: 2026-10-10
    typ: vyjadreni
    subjekty: [starostove-a-nezavisli]
    kdo: Vít Rakušan, předseda STAN (celostátní vedení)
    doklad: parafraze
    shrnuti: >-
      Předseda hnutí podle CNN Prima NEWS řekl, že si nepřeje křehkou
      dvoubarevnou koalici — tedy jen STAN a SPOLU, které by měly 34 mandátů,
      jen o jeden víc, než je většina.
    zdroje: [cnn-11-10]

  - id: hlavacek-portlik-telefon
    datum: 2026-10-10
    typ: jednani
    subjekty: [starostove-a-nezavisli, spolu-pro-prahu]
    sestava: [starostove-a-nezavisli, spolu-pro-prahu]
    kdo: Petr Hlaváček a Tomáš Portlík
    doklad: parafraze
    shrnuti: >-
      Lídři STAN a SPOLU si ještě během sčítání zavolali a domluvili se, že se
      sejdou nejpozději v pondělí 12. 10. První schůzka má být o programových
      prioritách STAN.
    zdroje: [pd-10-10, ct24-10-10]

  - id: spolu-primator-vitezi
    datum: 2026-10-10
    typ: vyjadreni
    subjekty: [spolu-pro-prahu]
    kdo: Tomáš Portlík, lídr kandidátky
    doklad: citace
    citace: >-
      Sluší se a patří slyšet tu vítězovu představu, pak teprve se budeme
      odvíjet dál.
    shrnuti: >-
      Portlík uznal nárok vítězného STAN na post primátora. SPOLU je podle něj
      otevřené různým gescím, sám zmínil finance nebo dopravu.
    zdroje: [ct24-10-10, pd-10-10]

  - id: portlik-nevylucuje-varianty
    datum: 2026-10-10
    typ: vyjadreni
    subjekty: [spolu-pro-prahu]
    kdo: Tomáš Portlík, lídr kandidátky
    doklad: citace
    citace: >-
      Úvahy o koalicích jsou předčasné, ale nevylučuji různé varianty.
    shrnuti: >-
      Na tiskové konferenci ODS během sčítání Portlík na přímý dotaz odmítl
      spolupráci s ANO vyloučit; první schůzku chce mít se STAN. Předseda ODS
      Martin Kupka koalici s ANO naopak odmítl: podle něj bude „možné
      uspořádat funkčně jiné koalice“.
    zdroje: [prahain-10-10]

  - id: spolu-k-ano
    datum: 2026-10-10
    typ: vyjadreni
    subjekty: [spolu-pro-prahu]
    kdo: Tomáš Portlík, lídr kandidátky
    doklad: citace
    citace: >-
      Pražané jasně rozdali karty, myslím, že je vyloučitelné, že bude
      v koalici ANO.
    shrnuti: >-
      Později večer, s víc sečtenými okrsky, Portlík koalici s ANO označil za
      vyloučitelnou. K úvahám, že by SPOLU mohlo za primátorský post jít s ANO,
      řekl: „Takové spekulace jsou zbytečné, bude možné sestavit jiné funkční
      koalice.“ Výslovné vyloučení to není, proto ho výčet sestav nevyznačuje.
    zdroje: [ct24-10-10, e15-11-10]

  - id: spolu-pirati-praha-sobe
    datum: 2026-10-10
    typ: vyjadreni
    subjekty: [spolu-pro-prahu]
    kdo: Tomáš Portlík, lídr kandidátky
    doklad: citace
    citace: >-
      Že bychom si od Pirátů rádi odpočinuli, stále platí.
    shrnuti: >-
      Portlík zopakoval, že SPOLU nechce pokračovat v koalici s Piráty.
      Skeptický byl i k Praze sobě: „Ať jsem fér, tak ani nevím, jak by to
      vypadalo čtyři roky v koalici s Prahou sobě.“ Spolupráci s nimi ale
      nevyloučil.
    zdroje: [cnn-11-10, ct24-10-10]

  - id: praha-sobe-jedna-se-spolu
    datum: 2026-10-10
    typ: jednani
    subjekty: [praha-sobe, spolu-pro-prahu]
    kdo: Adam Scheinherr, lídr kandidátky
    doklad: parafraze
    shrnuti: >-
      Scheinherr se měl v neděli 11. 10. sejít s Portlíkem a nejspíš v pondělí
      s Hlaváčkem. Praha sobě chce gesci dopravy a novou radu do listopadového
      zasedání zastupitelstva. Za jednu z variant označil koalici se SPOLU,
      STAN a Piráty.
    zdroje: [denikn-10-10, ct24-10-10, cnn-11-10]

  - id: pirati-mestotvorna
    datum: 2026-10-10
    typ: vyjadreni
    subjekty: [ceska-piratska-strana]
    sestava: [starostove-a-nezavisli, praha-sobe, ceska-piratska-strana]
    kdo: Tereza Nislerová, lídryně kandidátky
    doklad: citace
    citace: >-
      Je důležité, že v tuto chvíli je možné sestavit ‚městotvornou‘ koalici,
      ke které jsme vyzývali, a která by byla složená na platformě STAN, Prahy
      sobě a Pirátů.
    shrnuti: >-
      Piráti chtějí koalici se STAN a Prahou sobě (38 mandátů). V neděli
      11. 10. měli ustavit klub a vyjednávací strategii; jako první se obrátí
      na STAN a Prahu sobě.
    zdroje: [cnn-11-10, ct24-10-10]

  - id: ano-bez-piratu
    datum: 2026-10-10
    typ: vylouceni
    subjekty: [ano-2011]
    vylucuje: [ceska-piratska-strana]
    kdo: Jan Hušbauer, lídr kandidátky
    doklad: parafraze
    shrnuti: >-
      ANO je podle Hušbauera připravené jednat se všemi kromě Pirátů. K jednání
      ho ale zatím nikdo neoslovil a STAN i SPOLU koalici s ANO vyloučily.
    zdroje: [ct24-10-10]

  - id: rakusan-ods-a-pirati
    datum: 2026-10-11
    typ: vyjadreni
    subjekty: [starostove-a-nezavisli]
    kdo: Vít Rakušan, předseda STAN (celostátní vedení)
    doklad: citace
    citace: >-
      Možná si nebudeme muset vybírat mezi ODS a Piráty. Ještě před volbami
      jsem odmítal, abychom vyloučili koalici se Spolu.
    shrnuti: >-
      Předseda hnutí k tomu, jestli STAN půjde se SPOLU, nebo s Prahou sobě
      a Piráty (38 mandátů). Piráti druhou variantu dlouhodobě preferují.
    zdroje: [prahain-11-10]

  - id: praha-sobe-proti-dvojkoalici
    datum: 2026-10-10
    typ: vyjadreni
    subjekty: [praha-sobe]
    kdo: Adam Scheinherr, lídr kandidátky
    doklad: citace
    citace: >-
      Nebylo by to dobré pro Prahu.
    shrnuti: >-
      Scheinherr o koalici jen STAN a SPOLU, která by měla 34 mandátů. Byla by
      podle něj „velice nestabilní“. Praha sobě se chce k oběma přidat; sestava
      STAN, SPOLU a Praha sobě by měla 47 mandátů.
    zdroje: [pd-scheinherr-10-10, prahain-11-10]

  - id: stan-klub-a-gesce
    datum: 2026-10-11
    typ: vyjadreni
    subjekty: [starostove-a-nezavisli]
    kdo: Petr Hlaváček, lídr kandidátky
    doklad: parafraze
    shrnuti: >-
      STAN chce post primátora a gesce územního rozvoje, školství, životního
      prostředí a ideálně financí; dopravu si dovede představit u SPOLU nebo
      třetího partnera. Hlaváček se v neděli krátce sešel s Portlíkem. Klub
      STAN vede Michal Biskup. Dohodu chce Hlaváček v listopadu.
    zdroje: [pd-biskup-11-10]

  - id: stan-spolu-prvni-jednani
    datum: 2026-10-12
    typ: jednani
