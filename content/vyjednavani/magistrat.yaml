  - id: spolu-primator-vitezi
    datum: 2026-10-10
    typ: vyjadreni
    subjekty: [spolu-pro-prahu]
    kdo: Tomáš Portlík, lídr kandidátky
    doklad: citace
    citace: >-
      Sluší se a patří slyšet tu vítězovu představu, pak teprve se budeme
      odvíjet dál.
    shrnuti: >-
      Portlík uznal nárok vítězného STAN na post primátora. SPOLU je podle něj
      otevřené různým gescím, sám zmínil finance nebo dopravu.
    zdroje: [ct24-10-10, pd-10-10]

  - id: spolu-vylucuje-ano
    datum: 2026-10-10
    typ: vylouceni
    subjekty: [spolu-pro-prahu]
    vylucuje: [ano-2011]
    kdo: Tomáš Portlík, lídr kandidátky
    doklad: citace
    citace: >-
      Pražané jasně rozdali karty, myslím, že je vyloučitelné, že bude
      v koalici ANO.
    shrnuti: >-
      SPOLU po sečtení většiny okrsků vyloučilo koalici s ANO.
    zdroje: [ct24-10-10, pd-10-10]

