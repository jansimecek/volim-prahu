  - id: spolu-k-ano
    datum: 2026-10-10
    typ: vyjadreni
    subjekty: [spolu-pro-prahu]
    kdo: Tomáš Portlík, lídr kandidátky
    doklad: citace
    citace: >-
      Pražané jasně rozdali karty, myslím, že je vyloučitelné, že bude
      v koalici ANO.
    shrnuti: >-
      Později večer, s víc sečtenými okrsky, Portlík koalici s ANO označil za
      vyloučitelnou. K úvahám, že by SPOLU mohlo za primátorský post jít s ANO,
      řekl: „Takové spekulace jsou zbytečné, bude možné sestavit jiné funkční
      koalice.“ Výslovné vyloučení to není, proto ho výčet sestav nevyznačuje.
    zdroje: [ct24-10-10, e15-11-10]

