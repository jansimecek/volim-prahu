    shrnuti: >-
      Portlík zopakoval, že SPOLU nechce pokračovat v koalici s Piráty.
      Skeptický byl i k Praze sobě: „Ať jsem fér, tak ani nevím, jak by to
      vypadalo čtyři roky v koalici s Prahou sobě.“ Spolupráci s nimi ale
      nevyloučil.
    zdroje: [cnn-11-10, ct24-10-10]

