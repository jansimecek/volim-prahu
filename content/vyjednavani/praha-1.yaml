    kdo: Pavel Marc, lídr Prahy 1 sobě
    doklad: citace
    citace: >-
      Nejbližší programovou shodu vidíme s TOP 09 a Piráty, s nimiž jsme se už
      o víkendu sešli.
    shrnuti: >-
      Vítězná Praha 1 sobě se o víkendu sešla s TOP 09 a Piráty; tahle trojice
      by měla 14 mandátů z 27, tedy přesně většinu. Jednat chce se všemi
      zvolenými uskupeními.
    zdroje: [pd-praha1-12-10]

  - id: praha-1-sobe-memorandum-do-prazdnin
    datum: 2026-10-19
    typ: vyjadreni
    subjekty: [praha-1-sobe]
    kdo: Pavel Marc, lídr Prahy 1 sobě
    doklad: citace
    citace: >-
      Stavíme na menším počtu spolehlivých partnerů, protože Praha 1 si
      nemůže dovolit další čtyři roky neustálých koaličních hádek a zříkání
      se zodpovědnosti.
    shrnuti: >-
      Praha 1 sobě chce memorandum o budoucí trojkoalici podepsat do
      podzimních prázdnin; partnery Marc podle přehledu Novinek neupřesnil.
      Post starosty má být podle něj vyústěním dohod, podstatnější je
      složení funkční rady.
    zdroje: [novinky-prehled-19-10]

  - id: smlouva-pet-uskupeni
    datum: 2026-10-21
    typ: koalicni-smlouva
    subjekty: [obcanska-demokraticka-strana, starostove-kdu-csl-s-podporou-iniciativy-obcanu-my-co-tady-zijeme, top-09-srdce-prahy, nase-praha-1-ano-2011-a-nezavisli-staromestska-lipa-sdruzeni-obcanu-a-pratel-stareho-mesta-a-josefova-v-praze-spolek, nezavisli-z-jednicky-kateriny-klasnove-a-davida-bodecka]
    sestava: [obcanska-demokraticka-strana, starostove-kdu-csl-s-podporou-iniciativy-obcanu-my-co-tady-zijeme, top-09-srdce-prahy, nase-praha-1-ano-2011-a-nezavisli-staromestska-lipa-sdruzeni-obcanu-a-pratel-stareho-mesta-a-josefova-v-praze-spolek, nezavisli-z-jednicky-kateriny-klasnove-a-davida-bodecka]
    kdo: Terezie Radoměřská (TOP 09) a zástupci dalších čtyř uskupení
    doklad: citace
    citace: >-
      Jsem ráda, že se nám podařilo najít společnou řeč napříč pěti
      uskupeními a dohodnout se na základech spolupráce pro další čtyři roky.
    shrnuti: >-
      ODS, Starostové s KDU-ČSL, TOP 09, Naše Praha 1 s ANO a Nezávislí
      Kateřiny Klasnové podepsali ve středu večer koaliční smlouvu, 17 hlasů
      z 27. Vítězná Praha 1 sobě v koalici není. Starostkou má zůstat
      Radoměřská; Petr Hejma (STAN) se nároku na post starosty vzdal.
      Ustavující zasedání má být v listopadu.
    zdroje: [patriot-praha1-22-10]

  - id: volba-radomerska
    datum: 2026-11-19
    typ: volba
    subjekty: [top-09-srdce-prahy, obcanska-demokraticka-strana, starostove-kdu-csl-s-podporou-iniciativy-obcanu-my-co-tady-zijeme, nase-praha-1-ano-2011-a-nezavisli-staromestska-lipa-sdruzeni-obcanu-a-pratel-stareho-mesta-a-josefova-v-praze-spolek, nezavisli-z-jednicky-kateriny-klasnove-a-davida-bodecka]
    kdo: Terezie Radoměřská (TOP 09), starostka
    doklad: citace
    citace: >-
      Jsem a dále hodlám být člověk, který spojuje více, než rozděluje.
    shrnuti: >-
      Starostkou podruhé zvolena Radoměřská; pět uskupení má 17 z 27 hlasů,
      Praha 1 sobě a Piráti jsou v opozici. Rada má devět členů, z toho pět
      místostarostů. Gesce jsou podle koaliční dohody, rada je měla potvrdit
      na první schůzi. Kontrolní výbor vede Amália Počarovská (Praha 1 sobě).
    zdroje: [web-praha1-vedeni-20-11, pd-praha1-volba-19-11]
