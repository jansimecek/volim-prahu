    doklad: parafraze
    shrnuti: >-
      Podle přehledu Novinek probíhají koaliční jednání. Vítězné STAN s lídrem
      Ondřejem Lagnerem má 6 z 25 mandátů, do zastupitelstva se dostalo sedm
      uskupení. Konkrétní sestava doložená není.
    zdroje: [novinky-prehled-19-10]

  - id: dohoda-stan-ok22-pirati
    datum: 2026-10-20
    typ: dohoda
    subjekty: [starostove-a-nezavisli, ok22-s-podporou-praha-sobe, ceska-piratska-strana]
    sestava: [starostove-a-nezavisli, ok22-s-podporou-praha-sobe, ceska-piratska-strana]
    kdo: Vojtěch Zelenka (STAN), bývalý starosta
    doklad: citace
    citace: >-
      Základem budoucí koalice budou Starostové, OK22 s podporou Prahy sobě
      a Piráti. Ti disponují 13 hlasy, což je těsná většina v zastupitelstvu.
      Z tohoto důvodu hledáme ještě jednoho koaličního partnera, abychom měli
      přesvědčivou většinu.
    shrnuti: >-
      STAN, OK22 s podporou Prahy sobě a Piráti se dohodli na základu
      koalice, 13 hlasů z 25. Hledají čtvrtého partnera. Kandidáty na
      starostu mají STAN i OK22; rozhodne podoba koalice. Jasno chtějí mít do
      konce října.
    zdroje: [pd-praha22-20-10]

  - id: volba-kabilova
    datum: 2026-11-09
    typ: volba
    subjekty: [starostove-a-nezavisli, ok22-s-podporou-praha-sobe, ceska-piratska-strana, obcanska-demokraticka-strana, dvacetdvojka]
    kdo: místní organizace STAN na facebooku
    doklad: citace
    citace: >-
      V zájmu hladkého dokončení školy jsme akceptovali variantu, aby
      tuto investici dokončil Martin Langmajer z ODS, a to na základě
      mandátu, který omezuje jeho působení v radě městské části na dva
      roky do listopadu 2028.
    shrnuti: >-
      Starostkou zvolena Jana Kabilová (za STAN, 24 hlasů z 25),
      vystřídala Kaněru (ANO). Koalice STAN, OK22, Pirátů, ODS a
      DvacetDvojky má 19 z 25. Místostarostou je končící primátorův
      náměstek pro dopravu Jaromír Beránek (Piráti); Langmajer (ODS)
      zůstane v radě jen do dokončení ZŠ Romance.
    zdroje: [pd-praha22-9-11]
