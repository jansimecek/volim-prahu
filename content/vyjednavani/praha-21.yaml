    doklad: citace
    citace: >-
      Mojí představou je vedení městské části založené na spolupráci,
      otevřené komunikaci a vzájemném respektu.
    shrnuti: >-
      Starostkou zvolena Doležalová (13 ze 17 hlasů), vládne STAN s
      Újezd21 (9 ze 17). Uvolněni jsou jen ona a Jackanič. Prioritou má
      být stabilizace školy po epidemii salmonelózy; rada rozhodne i o
      petici za odvolání ředitele. Gesce radních zdroj neuvádí.
    zdroje: [pd-praha21-9-11]
