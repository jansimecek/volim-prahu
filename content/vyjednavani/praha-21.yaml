    doklad: parafraze
    shrnuti: >-
      Vítězné STAN – Újezd žije uzavřelo koalici s uskupením Újezd21, 9 hlasů
      ze 17. Starostkou má být Doležalová, rada má mít pět členů. ODS a TOP 09,
      které dosud vedly radnici, jdou do opozice. Prioritou je podle ní
      stabilizace školy po epidemii salmonelózy.
    zdroje: [pd-praha21-2-11]

