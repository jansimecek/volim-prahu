udalosti:
  - id: zdrave-letnany-jedna-se-vsemi
    datum: 2026-10-18
    typ: jednani
    subjekty: [zdrave-letnany-s-podporou-prahy-sobe-piratu-lidovcu-a-zelenych]
    kdo: Zdravé Letňany na svém webu
    doklad: citace
    citace: >-
      Během uplynulého týdne jsme jednali se zástupci všech subjektů, které se
      dostaly do zastupitelstva.
    shrnuti: >-
      Vítězné Zdravé Letňany s podporou Prahy sobě, Pirátů, lidovců a Zelených
      (7 z 23) jednaly se všemi zvolenými uskupeními a další týden se s nimi
      budou scházet znovu. Partnera ani sestavu zatím neoznámily.
    zdroje: [zl-18-10]

  - id: dohoda-ano-spolu-nas-domov
    datum: 2026-10-20
    typ: dohoda
    subjekty: [ano-2011, spolu-pro-letnany, nas-domov-letnany]
    sestava: [ano-2011, spolu-pro-letnany, nas-domov-letnany]
    kdo: Zdeněk Kučera (ANO), starosta
    doklad: citace
    citace: >-
      Dohodli jsme se na pokračování stávající koalice a já budu nadále
      pokračovat ve funkci starosty Prahy 18.
    shrnuti: >-
      Dosavadní koalice ANO, SPOLU (ODS a TOP 09) a Náš domov Letňany
      pokračuje, 12 hlasů z 23. Vítězné Zdravé Letňany jdou do opozice.
      Posty v radě a gesce se budou řešit v dalších týdnech, ustavující
      zasedání má být v první polovině listopadu.
    zdroje: [patriot-praha18-20-10]

  - id: zdrave-letnany-do-opozice
    datum: 2026-10-20
    typ: vyjadreni
    subjekty: [zdrave-letnany-s-podporou-prahy-sobe-piratu-lidovcu-a-zelenych]
    kdo: Zdravé Letňany na sociálních sítích
    doklad: citace
    citace: >-
      Pro sestavení koalice změny jsme udělali maximum. Naší rolí tedy teď
      bude poctivá a aktivní opoziční práce a to ještě ve větší intenzitě než
      doposud.
    shrnuti: >-
      Vítězné Zdravé Letňany (7 mandátů) s ANO jednaly, k dohodě ale
      nedošlo. Svůj program chtějí v opozici prosazovat s dalšími opozičními
      uskupeními.
    zdroje: [patriot-praha18-20-10]

  - id: volba-kucera
    datum: 2026-11-09
    typ: volba
    subjekty: [ano-2011, spolu-pro-letnany, nas-domov-letnany]
    kdo: zastupitelstvo Prahy 18
    doklad: parafraze
    shrnuti: >-
      Starostou potřetí zvolen Zdeněk Kučera (ANO), 12 hlasů z 23. Vedou
      ANO, Spolu (ODS, TOP 09) a Náš domov Letňany; vítězné Zdravé
      Letňany jsou v opozici. Šestičlenná rada je celá uvolněná, gesce
      rozdělila hned při volbě.
    zdroje: [pd-praha18-9-11]
