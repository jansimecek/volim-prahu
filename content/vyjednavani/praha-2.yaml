      nebude; ANO jde do opozice. Praha 2 sobě a Piráti tak po čtyřech letech
      v opozici míří do vedení.
    zdroje: [pd-praha2-27-10]

  - id: smlouva-spolu-ps2-pirati
    datum: 2026-11-04
    typ: koalicni-smlouva
    subjekty: [spolu-pro-prahu-2, praha-2-sobe, ceska-piratska-strana]
    sestava: [spolu-pro-prahu-2, praha-2-sobe, ceska-piratska-strana]
    kdo: SPOLU pro Prahu 2 na facebooku
    doklad: citace
    citace: >-
      Jsme rádi, že se nám podařilo najít společnou cestu a dohodnout se na
      spolupráci. Touto koalicí jsme vyslyšeli vůli voličů a vytvořili tak
      dobrý základ pro další práci na Praze 2.
    shrnuti: >-
      SPOLU, Praha 2 sobě a Piráti ve středu podepsali koaliční smlouvu,
      26 mandátů z 35. Starostou má zůstat Jan Korseska (ODS). Ustavující
      zasedání bude v pondělí 9. 11.
    zdroje: [pd-praha2-smlouva-5-11]

  - id: volba-korseska
    datum: 2026-11-09
    typ: volba
    subjekty: [spolu-pro-prahu-2, praha-2-sobe, ceska-piratska-strana]
    kdo: Jan Korseska (ODS), starosta
    doklad: citace
    citace: >-
      Jsem rád, že tady mohu stát jako nově zvolený starosta a slíbit
      vám, že se budu snažit řídit Prahu 2 tak, aby si udržela svůj
      vysoký životní standard pro své občany.
    shrnuti: >-
      Zastupitelstvo zvolilo podruhé starostou Jana Korsesku (27 z 34
      hlasů). Rada 9 členů: Spolu 4, Praha 2 sobě 3, Piráti 2. Na první
      schůzi 10. 11. si rada rozdělila gesce: dopravu po Halvovi (TOP
      09) převzal Jiří Mach (Praha 2 sobě), životní prostředí po
      Recmanovi Jana Bašusová.
    zdroje: [pd-praha2-volba-9-11, patriot-praha2-gesce-10-11]
