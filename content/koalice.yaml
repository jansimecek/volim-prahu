deklarace:
  - id: pirati-povolebni-strategie
    subjekt: ceska-piratska-strana
    kdo: Krajské fórum Pirátů v Praze
    uroven: prazska-organizace
    datum: 2026-08-10
    vylucuje: [ano-2011, spd-pro-prahu, motoriste-sobe, spojena-levice-pro-prahu]
    doklad: usneseni
    citace: >-
      Nepodpoříme Radu s účastí subjektů ohrožujících základy liberální
      demokracie nebo s historickým dědictvím likvidace demokracie v této zemi,
      tj. zejména s účastí KSČM, SPD a Motoristy. […] Spolupráci s hnutím ANO
      na pražské radnici nepovažujeme za slučitelnou s tím, na čem si jako
      Piráti zakládáme.
    shrnuti: >-
      Povolební strategie schválená krajským fórem vylučuje radu s účastí ANO,
      SPD, Motoristů a KSČM. Obsazení rady i jakoukoli smlouvu o povolební
      spolupráci musí schválit krajské fórum.
    poznamka: >-
      KSČM kandiduje na magistrát na společné listině Spojená levice pro Prahu,
      proto je vyloučení zapsané u ní. Strategie počítá i s tolerancí menšinové
      rady a v opozici s požadavkem na předsednictví kontrolního výboru.
    zdroje: [pirati-strategie, pd-pirati-12-8]

  - id: pirati-nislerova-anketa
    subjekt: ceska-piratska-strana
    kdo: Tereza Nislerová, lídryně kandidátky
    uroven: lidr-kandidatky
    datum: 2026-09-12
    vylucuje: [ano-2011, motoriste-sobe]
    pripousti: [starostove-a-nezavisli, praha-sobe, spolu-pro-prahu]
    doklad: citace
    citace: >-
      Piráti v povolební strategii vyloučili spolupráci s extremisty,
      motoristy, jakýmkoliv typem šmelinářů a také s hnutím ANO […]. Jako
      ideální povolební uspořádání si představuji koalici Pirátů se STAN
      a Prahou Sobě, jako méně ideální s ODS.
    shrnuti: >-
      V písemné anketě ČTK zopakovala vyloučení ANO a Motoristů z povolební
      strategie. Za ideální označila koalici Pirátů se STAN a Prahou sobě,
      koalici s ODS za méně ideální.
    poznamka: >-
      Extremisty odpověď nejmenuje; povolební strategie z 10. 8. jmenuje KSČM,
      SPD a Motoristy. ODS kandiduje na magistrát v koalici SPOLU pro Prahu
      s TOP 09.
    zdroje: [pp-anketa-ctk-12-9]

  - id: praha-sobe-scheinherr-cerven
    subjekt: praha-sobe
    kdo: Adam Scheinherr, lídr kandidátky
    uroven: lidr-kandidatky
    datum: 2026-06-01
    vylucuje: [ano-2011]
    pripousti: [ceska-piratska-strana, spolu-pro-prahu]
    doklad: parafraze
    shrnuti: >-
      Podle ČTK zopakoval, že Praha sobě dlouhodobě odmítá spolupráci s ANO.
      Za nejpřirozenější povolební uspořádání označil spolupráci s Piráty,
      nevyloučil ani koalici s ODS.
    poznamka: ODS kandiduje na magistrát v koalici SPOLU pro Prahu s TOP 09.
    zdroje: [ctk-praha-sobe-1-6]

  - id: praha-sobe-scheinherr-srpen
    subjekt: praha-sobe
    kdo: Adam Scheinherr, lídr kandidátky
    uroven: lidr-kandidatky
    datum: 2026-08-30
    vylucuje: [ano-2011, spd-pro-prahu, motoriste-sobe]
    doklad: citace
    citace: >-
      vnímáme Motoristy sobě jako za extremisty, vnímáme takhle i SPD, a hnutí
      ANO s nimi spolupracuje, drží je u vlády, takže s nimi rozhodně
      spolupracovat nebudeme
    shrnuti: >-
      V Poledni s Moravcem odmítl po volbách spolupracovat s Motoristy, SPD
      i s hnutím ANO. S ostatními stranami podle svých slov jedná a spolupráci
      s nimi vítá.
    poznamka: Že se vyloučení týká i ANO, uvádí k citaci výslovně ČTK.
    zdroje: [pd-scheinherr-30-8]

  - id: praha-sobe-scheinherr-anketa
    subjekt: praha-sobe
    kdo: Adam Scheinherr, lídr kandidátky
    uroven: lidr-kandidatky
    datum: 2026-09-12
    vylucuje: [spd-pro-prahu, motoriste-sobe, ano-2011]
    pripousti: [ceska-piratska-strana, starostove-a-nezavisli, spolu-pro-prahu]
    doklad: citace
    citace: >-
      Jako primátor bych rád vedl koalici Prahy Sobě, Pirátů a STAN. Nebráním
      se ani spolupráci se Spolu. Určitě ale v žádném případě nebudeme
      spolupracovat s extremisty z SPD a Motoristů. Odmítáme i spolupráci
      s hnutím ANO, které tyto extremisty přivedlo do celostátní vlády.
    shrnuti: >-
      V písemné anketě ČTK uvedl, že by jako primátor rád vedl koalici Prahy
      sobě, Pirátů a STAN, a nebrání se ani spolupráci se SPOLU. Vyloučil
      spolupráci s SPD, Motoristy a ANO.
    zdroje: [pp-anketa-ctk-12-9]

  - id: motoriste-sovova-praha-sobe
    subjekt: motoriste-sobe
    kdo: Klára Sovová, lídryně kandidátky
    uroven: lidr-kandidatky
    datum: 2026-08-30
    vylucuje: [praha-sobe]
    doklad: citace
    citace: Tak my se zase nebudeme teda spolčovat s vámi
    shrnuti: >-
      V Poledni s Moravcem odpověděla Adamu Scheinherrovi, že se Motoristé
      s Prahou sobě spolčovat nebudou. Označení Motoristů za extremisty odmítla.
    zdroje: [pd-scheinherr-30-8]

  - id: motoriste-sovova-pirati
    subjekt: motoriste-sobe
    kdo: Klára Sovová, lídryně kandidátky
    uroven: lidr-kandidatky
    datum: 2026-08-30
    vylucuje: [ceska-piratska-strana]
    doklad: parafraze
    shrnuti: V téže debatě podle ČTK uvedla, že pro Motoristy jsou nepřijatelným partnerem Piráti.
    zdroje: [pd-scheinherr-30-8]

  - id: motoriste-sovova-anketa
    subjekt: motoriste-sobe
    kdo: Klára Sovová, lídryně kandidátky
    uroven: lidr-kandidatky
    datum: 2026-09-12
    vylucuje: [ceska-piratska-strana, praha-sobe]
    doklad: citace
    citace: Už nyní ale vylučujeme spolupráci s Piráty a Prahou Sobě.
    shrnuti: >-
      V písemné anketě ČTK vyloučila spolupráci s Piráty a Prahou sobě.
      Koalice se podle ní sestavují až po volbách.
    poznamka: Vyloučení Pirátů dosud dokládala jen parafráze ČTK z 30. 8.
    zdroje: [pp-anketa-ctk-12-9]

  - id: spd-urban
    subjekt: spd-pro-prahu
    kdo: Milan Urban, lídr kandidátky
    uroven: lidr-kandidatky
    datum: 2026-09-05
    vylucuje: [ceska-piratska-strana, praha-sobe]
    pripousti: [ano-2011, motoriste-sobe]
    doklad: citace
    citace: >-
      Z mých vystoupení určitě víte, že bych rozhodně nešel do koalice s Piráty
      nebo Prahou sobě.
    shrnuti: >-
      V rozhovoru pro CNN Prima News vyloučil koalici s Piráty a Prahou sobě.
      Spolupráci s ANO a Motoristy po vzoru vládní koalice označil za logickou;
      o lidech z ODS, TOP 09 a STAN mluvil jako o jednotlivcích.
    poznamka: >-
      Na otázku, jestli lze čekat spolupráci s hnutím ANO a Motoristy po vzoru
      vládní koalice, odpověděl „Vycházelo by to logicky.“ a pokračoval
      citovanou větou.
    zdroje: [cnn-urban-5-9]

  - id: spd-urban-anketa
    subjekt: spd-pro-prahu
    kdo: Milan Urban, lídr kandidátky
    uroven: lidr-kandidatky
    datum: 2026-09-12
    doklad: citace
    citace: >-
      My jsme ochotni spolupracovat se všemi ochotnými politiky, co jsou tady
      pro Pražany, ne proti Pražanům. Vyložení škůdci Prahy jsou však Piráti
      a Praha Sobě.
    shrnuti: >-
      V písemné anketě ČTK uvedl, že SPD je ochotna spolupracovat se všemi
      politiky, kteří jsou tu pro Pražany. Piráty a Prahu sobě označil za
      škůdce Prahy a STAN podle něj potřebuje větší sebereflexi.
    poznamka: >-
      V anketě koalici s nikým výslovně nevylučuje. Koalici s Piráty a Prahou
      sobě výslovně vyloučil 5. 9. v rozhovoru pro CNN Prima News.
    zdroje: [pp-anketa-ctk-12-9]

  - id: ano-husbauer-pirati
    subjekt: ano-2011
    kdo: Jan Hušbauer, lídr kandidátky
    uroven: lidr-kandidatky
    datum: 2026-08-12
    vylucuje: [ceska-piratska-strana]
    doklad: citace
    citace: >-
      Představa, že bychom šli do koalice s někým, kdo posledních osm let ničí
      Prahu a kvalitu života Pražanů, je pro mě noční můra.
    shrnuti: >-
      V reakci na pirátskou povolební strategii pro ČTK odmítl koalici
      s Piráty, které v navazující větě jmenuje.
    zdroje: [respekt-ctk-12-8]

  - id: ano-husbauer-spolu
    subjekt: ano-2011
    kdo: Jan Hušbauer, lídr kandidátky
    uroven: lidr-kandidatky
    datum: 2026-08-23
    pripousti: [spolu-pro-prahu]
    doklad: citace
    citace: My v tuhletu chvíli nevylučujeme tuto spolupráci (se Spolu)
    shrnuti: >-
      V Poledni s Moravcem nevyloučil spolupráci se SPOLU; důležité podle něj
      budou programové záležitosti.
    poznamka: Upřesnění „(se Spolu)“ doplnila do citace ČTK.
    zdroje: [ctk-portlik-23-8]

  - id: ano-husbauer-anketa
    subjekt: ano-2011
    kdo: Jan Hušbauer, lídr kandidátky
    uroven: lidr-kandidatky
    datum: 2026-09-12
    pripousti: [spolu-pro-prahu]
    doklad: citace
    citace: >-
      Spolupráci s ODS či koalicí Spolu si za určitých programových
      a personálních podmínek představit umím. Piráti jsou pro nás velmi
      nepravděpodobným partnerem a jasně říkám, že v radě se Zdeňkem Hřibem
      sedět nechci.
    shrnuti: >-
      V písemné anketě ČTK uvedl, že si za určitých programových a personálních
      podmínek umí představit spolupráci s ODS či koalicí SPOLU. Piráty označil
      za velmi nepravděpodobného partnera a v radě se Zdeňkem Hřibem sedět nechce.
    poznamka: >-
      Koalici s Piráty odmítl už 12. 8.; v anketě ji výslovně nevylučuje.
      Zdeněk Hřib kandiduje na pirátské kandidátce na desátém místě.
    zdroje: [pp-anketa-ctk-12-9]

  - id: ano-havlicek
    subjekt: ano-2011
    kdo: Karel Havlíček, místopředseda ANO
    uroven: celostatni-vedeni
    datum: 2026-09-13
    vylucuje: [ceska-piratska-strana]
    pripousti: [spolu-pro-prahu, starostove-a-nezavisli]
    doklad: citace
    citace: >-
      Chceme v Praze uspět, abychom měli primátora a dostali konečně Piráty
      mimo dosah působnosti. Posledních osm let bylo tristních. Koalici sice
      vede ODS, ale fakticky v Praze řádí Piráti. My s nimi vládnout rozhodně
      nebudeme
    shrnuti: >-
      V Partii CNN Prima News vyloučil vládnutí s Piráty. Spolupráci s ODS ani
      se STAN v Praze podle ČTK i CNN Prima News nevyloučil.
    poznamka: >-
      Že koalici s ODS a STAN nevyloučil, píší ČTK i CNN Prima News vlastními
      slovy; doslovnou větu k tomu nemáme. ODS kandiduje na magistrát
      v koalici SPOLU pro Prahu s TOP 09.
    zdroje: [cnn-partie-13-9, ctk-partie-13-9, pd-uhrineves-13-9]

  - id: spolu-portlik
    subjekt: spolu-pro-prahu
    kdo: Tomáš Portlík, lídr kandidátky
    uroven: lidr-kandidatky
    datum: 2026-08-23
    doklad: citace
    citace: Nerad bych udělal koalici s ANO
    shrnuti: >-
      V Poledni s Moravcem koalici s ANO nevyloučil, ale řekl, že by ji udělal
      nerad. Pokud by výsledek voleb neumožnil sestavit stabilní koalici, je
      podle svých slov připraven v koalici nebýt.
    zdroje: [ctk-portlik-23-8]

  - id: spolu-portlik-anketa
    subjekt: spolu-pro-prahu
    kdo: Tomáš Portlík, lídr kandidátky
    uroven: lidr-kandidatky
    datum: 2026-09-12
    doklad: citace
    citace: >-
      Nechci dopředu žádnou stranu vylučovat nebo naopak utvářet koalice ještě
      před tím, než rozhodnou voliči.
    shrnuti: >-
      V písemné anketě ČTK uvedl, že dopředu nechce žádnou stranu vylučovat
      ani utvářet koalice, dokud nerozhodnou voliči. Do vedení města si chce
      vybrat schopné a zkušené lidi bez ohledu na stranické průkazky.
    zdroje: [pp-anketa-ctk-12-9]

  - id: spolu-portlik-echo24
    subjekt: spolu-pro-prahu
    kdo: Tomáš Portlík, lídr kandidátky
    uroven: lidr-kandidatky
    datum: 2026-09-14
    doklad: citace
    citace: >-
      Záměrně nevylučuji nic, protože jsem zažil už hodně volebních výsledků,
      kdy se deklarací jednoho politického scénáře uměle vytvořil scénář jiný.
    shrnuti: >-
      V rozhovoru pro Echo24 na otázku po koalici s Piráty řekl, že záměrně
      nevylučuje nic. Dopravu by jim ale svěřit nechtěl a koalici opřenou
      o ultimáta partnerů podle svých slov vést nebude.
    zdroje: [echo-portlik-14-9]

  - id: ods-kupka
    subjekt: spolu-pro-prahu
    kdo: Martin Kupka, předseda ODS
    uroven: celostatni-vedeni
    datum: 2026-09-13
    vylucuje: [spojena-levice-pro-prahu]
    pripousti: [starostove-a-nezavisli]
    doklad: citace
    citace: >-
