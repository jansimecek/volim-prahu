# Doložená předvolební vyjádření o povolební spolupráci na magistrátu.
#
# Zapisuje se jen to, co jde ukázat u zdroje: usnesení strany, doslovná
# citace, nebo parafráze médií — a vždy s označením, co z toho to je.
# „Nevyloučil“ z titulku není citace. Kdo mluvil za celostátní vedení, není
# lídr pražské kandidátky, a u vyjádření je to vidět.
#
# Pole `vylucuje` vyznačuje kalkulačka mandátů u sestav, kde se oba subjekty
# potkají. Slug musí být ten, pod kterým subjekt kandiduje na magistrát —
# KSČM je na listině spojena-levice-pro-prahu, ODS v koalici spolu-pro-prahu —
# a u každého takového převodu je poznámka.
#
# Vědomě tu chybí SEN pro Prahu a JSME PRAHA: jejich stanoviska uvádí jen
# iROZHLAS z 31. 8. 2026, jehož text se nepodařilo otevřít a ověřit, a
# v písemné anketě ČTK z 12. 9. 2026 (lídři stran ze stávajícího
# zastupitelstva a Motoristé) nejsou.
#
# Odpovědi z ankety ČTK jsou písemné odpovědi lídrů otištěné pod jejich jménem,
# proto jsou zapsané jako citace.

