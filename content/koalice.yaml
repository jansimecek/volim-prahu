  - id: stan-rakusan
    subjekt: starostove-a-nezavisli
    kdo: Vít Rakušan, předseda STAN
    uroven: celostatni-vedeni
    datum: 2026-09-13
    vylucuje: [spd-pro-prahu, spojena-levice-pro-prahu]
    doklad: citace
    citace: >-
      My obecně necháváme našim regionů velkou volnost ve skládání koalic
      a spoléháme na to, že oni vědí, kdo je tím pravým partnerem. Dlouhodobě
      říkám, že ta červená linie pro nás jsou určitě strany, které my
      považujeme za extrémní, ať už jsou to komunisté nebo SPD.
    shrnuti: >-
      V Partii CNN Prima News řekl, že koalice nechává STAN na regionech
      a červenou linií jsou komunisté a SPD. Koalici s ANO podle ČTK
      nevyloučil, není ale preferovanou variantou; přednost dává SPOLU.
    poznamka: Komunisté (KSČM a KSČ) kandidují na listině Spojená levice pro Prahu.
    zdroje: [ctk-partie-13-9, aktualne-rakusan-13-9]
